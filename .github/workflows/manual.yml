name: Build BikeHello iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify synced index
        run: |
          echo "=== CHECK ios/App/App/public/index.html ==="
          grep -n 'vPower' ios/App/App/public/index.html
          grep -n 'B – GPS Plugin registriert' ios/App/App/public/index.html || true
          grep -n 'B1 - nach GPS Plugin' ios/App/App/public/index.html || true
          grep -n 'C - GPS BLOCK' ios/App/App/public/index.html || true
          echo "=== END CHECK ==="

      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Create IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r BikeHello.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BikeHello-IPA
          path: ios/App/build/BikeHello.ipa
