<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeHello Magnetometer</title>

<style>
body {
margin: 0;
background: #000;
color: #fff;
font-family: Arial, sans-serif;
overflow: hidden;
}

#app {
height: 100vh;
display: flex;
flex-direction: column;
padding: 12px;
box-sizing: border-box;
}

h1 {
margin: 4px 0 8px;
text-align: center;
font-size: 22px;
}

#values {
display: flex;
justify-content: space-around;
font-size: 14px;
margin-bottom: 8px;
}

.value {
font-weight: bold;
}

#chart {
width: 100%;
height: 40vh;
background: #111;
border: 1px solid #555;
box-sizing: border-box;
}

#controls {
display: flex;
gap: 12px;
margin-top: 10px;
}

button {
flex: 1;
padding: 14px;
font-size: 18px;
border: none;
border-radius: 8px;
}

#start {
background: #1db954;
color: white;
}

#stop {
background: #d32f2f;
color: white;
}
</style>
</head>

<body>

<div id="app">

<h1>BikeHello Magnetometer</h1>

<div id="debug" style="
background:#222;
border:1px solid #666;
padding:8px;
margin-bottom:8px;
font-size:13px;
font-family:monospace;
color:#fff;
">
DEBUG: App gestartet - Version 0011
</div>


<div id="values">
<div class="value" id="xValue" style="color:#ff3b30;">X: --</div>
<div class="value" id="yValue" style="color:#34c759;">Y: --</div>
<div class="value" id="zValue" style="color:#007aff;">Z: --</div>
<div class="value" id="bValue" style="color:#ffffff;">|B|: --</div>
</div>

<div id="gpsValues" style="
display:grid;
grid-template-columns:1fr 1fr;
gap:4px 12px;
font-size:13px;
font-family:monospace;
margin-bottom:8px;
">
<div id="gpsLat">LAT: --</div>
<div id="gpsLon">LON: --</div>
<div id="gpsSpeed">SPEED: --</div>
<div id="gpsCourse">COURSE: --</div>
<div id="gpsAccuracy">ACC: --</div>
<div id="gpsAltitude">ALT: --</div>
</div>

<canvas id="chart"></canvas>

<div id="controls">
<button id="start">START</button>
<button id="stop">STOPP</button>
</div>

</div>

<script type="module">
import { registerPlugin } from "./capacitor-core.js";
const Magnetometer = registerPlugin("Magnetometer");
const GPS = registerPlugin("GPS");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

const xValue = document.getElementById("xValue");
const yValue = document.getElementById("yValue");
const zValue = document.getElementById("zValue");
const bValue = document.getElementById("bValue");

const gpsLat = document.getElementById("gpsLat");
const gpsLon = document.getElementById("gpsLon");
const gpsSpeed = document.getElementById("gpsSpeed");
const gpsCourse = document.getElementById("gpsCourse");
const gpsAccuracy = document.getElementById("gpsAccuracy");
const gpsAltitude = document.getElementById("gpsAltitude");

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

let running = false;

const debug = document.getElementById("debug");

function debugMessage(message) {
    debug.textContent = "DEBUG: " + message;
}

let xData = [];
let yData = [];
let zData = [];
let bData = [];

const maxPoints = 300;

function resizeCanvas() {
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
debugMessage("JS BIS RESIZE OK - Version 0013");

function drawGrid() {
ctx.strokeStyle = "#333";
ctx.lineWidth = 1;

const width = canvas.width;
const height = canvas.height;

for (let i = 0; i <= 10; i++) {
const x = (width / 10) * i;

ctx.beginPath();
ctx.moveTo(x, 0);
ctx.lineTo(x, height);
ctx.stroke();
}

for (let i = 0; i <= 8; i++) {
const y = (height / 8) * i;

ctx.beginPath();
ctx.moveTo(0, y);
ctx.lineTo(width, y);
ctx.stroke();
}
}

function drawLine(data, color, min, max) {
if (data.length < 2) {
return;
}

ctx.strokeStyle = color;
ctx.lineWidth = 2;
ctx.beginPath();

const width = canvas.width;
const height = canvas.height;

for (let i = 0; i < data.length; i++) {
const x = (i / (maxPoints - 1)) * width;

const normalized = (data[i] - min) / (max - min);
const y = height - normalized * height;

if (i === 0) {
ctx.moveTo(x, y);
} else {
ctx.lineTo(x, y);
}
}

ctx.stroke();
}

function draw() {
if (!running) {
return;
}

ctx.clearRect(0, 0, canvas.width, canvas.height);

drawGrid();

const allData = [...xData, ...yData, ...zData, ...bData];

if (allData.length > 0) {
let min = Math.min(...allData);
let max = Math.max(...allData);

if (min === max) {
min -= 1;
max += 1;
}

const margin = (max - min) * 0.1;

min -= margin;
max += margin;

drawLine(xData, "#ff3b30", min, max);
drawLine(yData, "#34c759", min, max);
drawLine(zData, "#007aff", min, max);
drawLine(bData, "#ffffff", min, max);
}

requestAnimationFrame(draw);
}

function addSample(x, y, z) {

const b = Math.sqrt(
x * x +
y * y +
z * z
);

xData.push(x);
yData.push(y);
zData.push(z);
bData.push(b);

if (xData.length > maxPoints) xData.shift();
if (yData.length > maxPoints) yData.shift();
if (zData.length > maxPoints) zData.shift();
if (bData.length > maxPoints) bData.shift();

xValue.textContent = "X: " + x.toFixed(2);
yValue.textContent = "Y: " + y.toFixed(2);
zValue.textContent = "Z: " + z.toFixed(2);
bValue.textContent = "|B|: " + b.toFixed(2);
}


/*
====================================================
ECHTE iPHONE-MAGNETOMETER-ANBINDUNG
====================================================
*/

debugMessage("REGISTER GLOBAL - Version 0021: " + (typeof registerPlugin));


/*
Magnetometer-Daten vom Swift-Plugin empfangen
*/

GPS.addListener("gpsDebug", (data) => { debugMessage(data.message); }); GPS.addListener("gpsData", (data) => { gpsLat.textContent = "LAT: " + data.lat.toFixed(6); gpsLon.textContent = "LON: " + data.lon.toFixed(6); gpsSpeed.textContent = "SPEED: " + (data.speed * 3.6).toFixed(1) + " km/h"; gpsCourse.textContent = "COURSE: " + data.course.toFixed(1) + "°"; gpsAccuracy.textContent = "ACC: " + data.horizontalAccuracy.toFixed(1) + " m"; gpsAltitude.textContent = "ALT: " + data.altitude.toFixed(1) + " m"; }); Magnetometer.addListener("magnetometerDebug", (data) => {
    debugMessage(data.message);
});

Magnetometer.addListener("magnetometerData", (data) => {

debugMessage(
    "JS: Daten empfangen X=" +
    data.x.toFixed(2) +
    " Y=" +
    data.y.toFixed(2) +
    " Z=" +
    data.z.toFixed(2)
);

if (!running) {
    return;
}

addSample(
    data.x,
    data.y,
    data.z
);
});

/*
START
*/

debugMessage("HANDLER REGISTRIERT - Version 0012");
startButton.addEventListener("click", async () => {

try {

debugMessage("BUTTON CLICK OK");

running = true;

xData = [];
yData = [];
zData = [];
bData = [];

await Magnetometer.start();
await GPS.start();

draw();

} catch (error) {

console.error("Magnetometer start error:", error);

running = false;

alert("Magnetometer konnte nicht gestartet werden.");
}
});


/*
STOPP
*/

stopButton.addEventListener("click", async () => {

try {

running = false;

await Magnetometer.stop();
await GPS.stop();

} catch (error) {

console.error("Magnetometer stop error:", error);
}
});

</script>

</body>
</html>
