<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Navigation</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#container {
    display: flex;
    width: 100%;
    height: 50vh;
    padding: 10px;
    box-sizing: border-box;
    gap: 10px;
}

#mapWrapper {
    flex: 1;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

#buttonColumn {
    width: 70px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.button {
    width: 70px;
    height: 50px;
    border-radius: 12px;
    background: #C3E2C8;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

.route {
    font-size: 36px;
}

.nav-icon {
    font-size: 42px;
}

.btn-txt {
    font-size: 21px;
    font-weight: bold;
}

/* Unterer Bereich */

#bottomPanel {
    height: 50vh;
    width: 100%;
    display: flex;
    box-sizing: border-box;
    padding: 20px;
    gap: 20px;
    background: rgba(255,255,255,0.9);
}

#vitaldaten {
    width: 55%;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

#sensorBottom {
    width: 45%;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.vital-item,
.sensor-item {
    display: flex;
    flex-direction: column;
}

.vital-label,
.sensor-label {
    font-size: 14px;
    color: #666;
    font-weight: 300;
}

.vital-value,
.sensor-value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 4px;
}

/* Route-Hinweis */

#routeHint {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    z-index: 9999;
}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

<div id="routeHint">Fahre zur angezeigten Route</div>

<!-- =====================================================
     KARTE + BUTTONS
===================================================== -->

<div id="container">

    <div id="mapWrapper">
        <div id="map"></div>
    </div>

    <div id="buttonColumn">

        <div id="btnRoute" class="button route">
            ?
        </div>

        <div id="btnNav" class="button">
            <span class="nav-icon">?</span>
        </div>

        <div id="btnToggle" class="button">
            <span id="iconGo" class="btn-txt">Go</span>
            <span id="iconBreak" class="btn-txt" style="display:none;">Break</span>
        </div>

        <div id="btnExit" class="button">
            <span class="btn-txt">Exit</span>
        </div>

    </div>

</div>


<!-- =====================================================
     UNTERER BEREICH
===================================================== -->

<div id="bottomPanel">

    <div id="vitaldaten">

        <div class="vital-item">
            <span class="vital-label">Speed (km/h)</span>
            <span class="vital-value" id="vSpeed">22.5</span>
        </div>

        <div class="vital-item">
            <span class="vital-label">Distance left (km)</span>
            <span class="vital-value" id="vDistLeft">38.8</span>
        </div>

        <div class="vital-item">
            <span class="vital-label">Time left (h)</span>
            <span class="vital-value" id="vTimeLeft">3:50</span>
        </div>

        <div class="vital-item">
            <span class="vital-label">Done (km, h)</span>
            <span class="vital-value" id="vDone">13.5, 2:01</span>
        </div>

    </div>


    <div id="sensorBottom">

        <div class="sensor-item">
            <span class="sensor-label">Speed (km/h)</span>
            <span class="sensor-value" id="smoothSpeed">22.5</span>
        </div>

        <div class="sensor-item">
            <span class="sensor-label">Heading (°)</span>
            <span class="sensor-value" id="smoothHeading">127</span>
        </div>

    </div>

</div>


<script>

/* =====================================================
   LEAFLET KARTE
===================================================== */

const map = L.map("map", {
    zoomControl: false
}).setView([49.806, 8.738], 13);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
    }
).addTo(map);


/* =====================================================
   TEST-MARKER
===================================================== */

const testMarker = L.marker([49.806, 8.738])
    .addTo(map)
    .bindPopup("Testposition");


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById("btnRoute").addEventListener("click", () => {
    console.log("Route Button");
});

document.getElementById("btnNav").addEventListener("click", () => {
    map.setView(testMarker.getLatLng(), 16);
});

document.getElementById("btnToggle").addEventListener("click", () => {

    const go = document.getElementById("iconGo");
    const br = document.getElementById("iconBreak");

    if (go.style.display !== "none") {
        go.style.display = "none";
        br.style.display = "inline";
    } else {
        go.style.display = "inline";
        br.style.display = "none";
    }
});

document.getElementById("btnExit").addEventListener("click", () => {
    console.log("Exit");
});

</script>

</body>
</html>
