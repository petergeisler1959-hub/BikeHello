<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bike Navigation</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: white;
    box-sizing: border-box;
}

*, *::before, *::after {
    box-sizing: border-box;
}


/* =====================================================
   APP-BEREICH
===================================================== */

#app {
    width: 100%;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}


/* =====================================================
   OBERER BEREICH
===================================================== */

#container {
    display: flex;
    width: 100%;
    height: 50vh;
    padding: 10px;
    gap: 10px;
    flex-shrink: 0;
}

#mapWrapper {
    flex: 1;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

#buttonColumn {
    width: 70px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.button {
    width: 70px;
    height: 50px;
    border-radius: 12px;
    background: #C3E2C8;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.button.disabled {
    opacity: 0.35;
    filter: grayscale(100%);
    cursor: default;
    pointer-events: none;
}
.status-box {
    width: 70px;
    height: 62px;
    border-radius: 12px;
    background: #F5F5F5;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.status-label {
    font-size: 8px;
    font-weight: bold;
    margin-bottom: 2px;
}

.status-icon {
    font-size: 27px;
    line-height: 27px;
}

.status-box.not-started {
    background: #FFD6D6;
}

.status-box.active {
    background: #C3E2C8;
}

.status-box.paused {
    background: #FFF0B3;
}

.button.route {
    font-size: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.marker-icon {
    width: 18px;
    height: auto;
}

.route-line {
    font-size: 40px;
    font-weight: 300;
    opacity: 0.8;
}

.nav-icon {
    font-size: 42px;
}

.btn-txt {
    font-size: 21px;
    font-weight: bold;
}

.btn-view {
    margin-top: 10px;
}


/* =====================================================
   UNTERER BEREICH
===================================================== */

#bottomPanel {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    padding: 20px;
    gap: 20px;
    background: rgba(255,255,255,0.9);
    overflow: hidden;
}

#vitaldaten {
    width: 55%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}

#sensorBottom {
    width: 45%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}


/* =====================================================
   WERTE
===================================================== */

.vital-item,
.sensor-item {
    display: flex;
    flex-direction: column;
}

.vital-label,
.sensor-label {
    font-size: 14px;
    color: #666;
    font-weight: 300;
}

.vital-value,
.sensor-value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 3px;
}

.secondary-value {
    font-size: 18px;
    color: #888;
    font-weight: 400;
    margin-left: 6px;
}


/* =====================================================
   ROUTE-HINWEIS
===================================================== */

#routeHint {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    z-index: 9999;
}

/* =====================================================
   GPS-MARKER
===================================================== */

.gps-dot {
    background: transparent;
    border: none;
}

.gps-dot div {
    width: 18px;
    height: 18px;
    background: #2E7D32;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.gps-arrow {
    background: transparent;
    border: none;
}

.gps-arrow div {
    font-size: 30px;
    line-height: 30px;
    color: #2E7D32;
    text-shadow:
        0 1px 2px white,
        0 0 2px white;
}

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>


<body>

<div id="app">

    <!-- =================================================
         KARTE + BUTTONS
    ================================================= -->

    <div id="container">

        <div id="mapWrapper">
            <div id="map"></div>
        </div>

        <div id="buttonColumn">

    <div id="navStatus" class="status-box not-started">
        <div class="status-label">not started</div>
        <div class="status-icon">O</div>
    </div>

    <div id="btnToggle" class="button">
        <span id="iconGo" class="btn-txt">Go</span>
        <span id="iconBreak" class="btn-txt" style="display:none;">Break</span>
    </div>

    <div id="btnExit" class="button">
        <span class="btn-txt">Stop</span>
    </div>

    <div style="height:10px;"></div>

    <div id="btnRoute" class="button route">
        <span class="btn-txt">ROUTE</span>
    </div>

    <div id="btnNav" class="button">
        <span class="btn-txt">GPS</span>
    </div>
    <div id="btnView" class="button btn-view">
        <span class="btn-txt">View</span>
    </div>

</div>

</div>
<!-- =================================================
         UNTERER BEREICH
    ================================================= -->

    <div id="bottomPanel">

        <!-- =============================================
             LINKE SEITE: NAVIGATION
        ============================================== -->

        <div id="vitaldaten">

            <div class="vital-item">
                <span class="vital-label">Speed (km/h)</span>
                <span class="vital-value" id="vSpeed">22.5</span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Distance (km)</span>
                <span class="vital-value">
                    <span id="vDistLeft">38.8</span>
                    <span class="secondary-value" id="vDistTotal">(52.3)</span>
                </span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Time (h)</span>
                <span class="vital-value">
                    <span id="vTimeLeft">3:50</span>
                    <span class="secondary-value" id="vTimeTotal">(5:12)</span>
                </span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Altitude (m)</span>
                <span class="vital-value" id="vAltitude">236</span>
            </div>

        </div>


        <!-- =============================================
             RECHTE SEITE: E-BIKE
        ============================================== -->

        <div id="sensorBottom">

            <div class="sensor-item">
                <span class="sensor-label">Power (W)</span>
                <span class="sensor-value" id="vPower">245</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Battery (%)</span>
                <span class="sensor-value" id="vBattery">67</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Range (km)</span>
                <span class="sensor-value" id="vRange">54</span>
            </div>

        </div>

    </div>

</div>


<script type="module">

/* =====================================================
   CAPACITOR / GPS
===================================================== */

import { registerPlugin } from "./capacitor-core.js";

const GPS = registerPlugin("GPS");
let gpsActive = false;


/* =====================================================
   LEAFLET KARTE
===================================================== */

const map = L.map("map", {
    zoomControl: false
}).setView([49.806, 8.738], 13);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "  OpenStreetMap"
    }
).addTo(map);

window.addEventListener("load", () => {
    map.invalidateSize(true);

    setTimeout(() => {
        map.invalidateSize(true);
    }, 500);

    setTimeout(() => {
        map.invalidateSize(true);
    }, 1000);
});


/* =====================================================
   GPS-POSITION AUF DER KARTE
===================================================== */

let gpsMarker = null;
let lastGpsData = null;
let mapCenteredOnGps = false;


/* Punkt fuer stehendes Fahrrad */
const gpsDotIcon = L.divIcon({
    className: "gps-dot",
    html: '<div></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 9]
});


/* Pfeil fuer fahrendes Fahrrad */
const gpsArrowIcon = L.divIcon({
    className: "gps-arrow",
    html: '<div>ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Â¦Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Â¦Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â¦ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Â¦ÃƒÂ¢Ã¢â€šÂ¬Ã…â€œÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Â¦Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â²</div>',
    iconSize: [30, 30],
    iconAnchor: [15, 15]
});


/* =====================================================
   WERTE
===================================================== */

const vSpeed = document.getElementById("vSpeed");
const vAltitude = document.getElementById("vAltitude");


/* =====================================================
   GPS-DATEN
===================================================== */

GPS.addListener("gpsDebug", (data) => {
    console.log(data.message);
});

GPS.addListener("gpsData", (data) => {

    /* =================================================
       SPEED + ALTITUDE
    ================================================= */

    vSpeed.textContent =
        (data.speed * 3.6).toFixed(1);

    vAltitude.textContent =
        data.altitude.toFixed(0);


    /* =================================================
       GPS-POSITION AUF DER KARTE
    ================================================= */

    const position = [
        data.lat,
        data.lon
    ];

    const courseValid = data.courseValid === true;


    /* =================================================
       MARKER ERSTELLEN
    ================================================= */

    if (!gpsMarker) {

    gpsMarker = L.circleMarker(position, {
        radius: 8,
        color: "#ffffff",
        weight: 2,
        fillColor: "#2E7D32",
        fillOpacity: 1,
        zIndexOffset: 1000
    }).addTo(map);

} else {

    gpsMarker.setLatLng(position);

    if (!mapCenteredOnGps) {
        map.setView(position, 16);
        mapCenteredOnGps = true;
    }
}


    /* Letzte GPS-Daten merken */
    lastGpsData = data;


    console.log(
        "GPS:",
        data.lat,
        data.lon,
        "Speed:",
        data.speed,
        "Course:",
        data.course,
        "valid:",
        data.courseValid,
        "Altitude:",
        data.altitude
    );
});

/* =====================================================
   BUTTONS
===================================================== */

const btnRoute = document.getElementById("btnRoute");
const btnNav = document.getElementById("btnNav");
const btnToggle = document.getElementById("btnToggle");
const btnExit = document.getElementById("btnExit");
const btnView = document.getElementById("btnView");

btnExit.classList.add("disabled");
btnView.classList.add("disabled");

const go = document.getElementById("iconGo");
const br = document.getElementById("iconBreak");


/* =====================================================
   ROUTE BUTTON
===================================================== */

btnRoute.addEventListener("click", () => {

    if (!lastGpsData) {
        return;
    }

    const center = [
        lastGpsData.lat,
        lastGpsData.lon
    ];

    const radiusKm = 10;

    const radiusMeters = radiusKm * 1000;

    const bounds = L.latLng(center).toBounds(radiusMeters);

    map.fitBounds(bounds, {
        padding: [20, 20]
    });

});


/* =====================================================
   NAVIGATION / KARTE
===================================================== */

btnNav.addEventListener("click", () => {

    if (lastGpsData) {
        map.setView(
            [lastGpsData.lat, lastGpsData.lon],
            16
        );
    }

});


/* =====================================================
   GO / BREAK
===================================================== */

btnToggle.addEventListener("click", async () => {

    try {

        if (go.style.display !== "none") {

            /* GO */

            if (!gpsActive) {
                await GPS.start();
                gpsActive = true;
            }

            go.style.display = "none";
            br.style.display = "inline";

            btnExit.classList.remove("disabled");

            console.log("Navigation gestartet");

        } else {

            /* BREAK */

            await GPS.stop();
            gpsActive = false;

            go.style.display = "inline";
            br.style.display = "none";

            console.log("Navigation pausiert");
        }

    } catch (error) {

        console.error("GPS Fehler:", error);

    }

});


/* =====================================================
   EXIT
===================================================== */

/* =====================================================
   GPS BEIM APP-START
===================================================== */

setTimeout(async () => {

    try {

        await GPS.start();
        gpsActive = true;

        console.log("GPS beim App-Start gestartet");

    } catch (error) {

        console.error("GPS Startfehler:", error);

    }

}, 500);


btnExit.addEventListener("click", async () => {

    try {

        await GPS.stop();
        gpsActive = false;

    } catch (error) {

        console.error("GPS Stop Fehler:", error);

    }

    go.style.display = "inline";
    br.style.display = "none";

    btnExit.classList.add("disabled");
    btnView.classList.add("disabled");

    console.log("Navigation beendet");
});

</script>

</body>
</html>
