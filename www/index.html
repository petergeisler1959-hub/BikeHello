<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bike Navigation</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: white;
    box-sizing: border-box;
}

*, *::before, *::after {
    box-sizing: border-box;
}


/* =====================================================
   APP-BEREICH
===================================================== */

#app {
    width: 100%;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}


/* =====================================================
   OBERER BEREICH
===================================================== */

#container {
    display: flex;
    width: 100%;
    height: 50vh;
    padding: 10px;
    gap: 10px;
    flex-shrink: 0;
}

#mapWrapper {
    flex: 1;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

#buttonColumn {
    width: 70px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.button {
    width: 70px;
    height: 50px;
    border-radius: 12px;
    background: #C3E2C8;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.button.route {
    font-size: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.marker-icon {
    width: 18px;
    height: auto;
}

.route-line {
    font-size: 40px;
    font-weight: 300;
    opacity: 0.8;
}

.nav-icon {
    font-size: 42px;
}

.btn-txt {
    font-size: 21px;
    font-weight: bold;
}


/* =====================================================
   UNTERER BEREICH
===================================================== */

#bottomPanel {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    padding: 20px;
    gap: 20px;
    background: rgba(255,255,255,0.9);
    overflow: hidden;
}

#vitaldaten {
    width: 55%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}

#sensorBottom {
    width: 45%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}


/* =====================================================
   WERTE
===================================================== */

.vital-item,
.sensor-item {
    display: flex;
    flex-direction: column;
}

.vital-label,
.sensor-label {
    font-size: 14px;
    color: #666;
    font-weight: 300;
}

.vital-value,
.sensor-value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 3px;
}

.secondary-value {
    font-size: 18px;
    color: #888;
    font-weight: 400;
    margin-left: 6px;
}


/* =====================================================
   ROUTE-HINWEIS
===================================================== */

#routeHint {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    z-index: 9999;
}

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>


<body>

<div id="app">

    <!-- =================================================
         KARTE + BUTTONS
    ================================================= -->

    <div id="container">

        <div id="mapWrapper">
            <div id="map"></div>
        </div>

        <div id="buttonColumn">

            <div id="btnRoute" class="button route">
                 <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png"
                      class="marker-icon">
                 <span class="route-line">↝</span>
                 <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png"
                       class="marker-icon">
            </div>

            <div id="btnNav" class="button">
                <span class="nav-icon">◮</span>
            </div>

            <div id="btnToggle" class="button">
                <span id="iconGo" class="btn-txt">Go</span>
                <span id="iconBreak" class="btn-txt" style="display:none;">Break</span>
            </div>

            <div id="btnExit" class="button">
                <span class="btn-txt">Exit</span>
            </div>

        </div>

    </div>


    <!-- =================================================
         UNTERER BEREICH
    ================================================= -->

    <div id="bottomPanel">

        <!-- =============================================
             LINKE SEITE: NAVIGATION
        ============================================== -->

        <div id="vitaldaten">

            <div class="vital-item">
                <span class="vital-label">Speed (km/h)</span>
                <span class="vital-value" id="vSpeed">22.5</span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Distance (km)</span>
                <span class="vital-value">
                    <span id="vDistLeft">38.8</span>
                    <span class="secondary-value" id="vDistTotal">(52.3)</span>
                </span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Time (h)</span>
                <span class="vital-value">
                    <span id="vTimeLeft">3:50</span>
                    <span class="secondary-value" id="vTimeTotal">(5:12)</span>
                </span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Altitude (m)</span>
                <span class="vital-value" id="vAltitude">236</span>
            </div>

        </div>


        <!-- =============================================
             RECHTE SEITE: E-BIKE
        ============================================== -->

        <div id="sensorBottom">

            <div class="sensor-item">
                <span class="sensor-label">Power (W)</span>
                <span class="sensor-value" id="vPower">245</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Battery (%)</span>
                <span class="sensor-value" id="vBattery">67</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Range (km)</span>
                <span class="sensor-value" id="vRange">54</span>
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   LEAFLET KARTE
===================================================== */

const map = L.map("map", {
    zoomControl: false
}).setView([49.806, 8.738], 13);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
    }
).addTo(map);


/* =====================================================
   TEST-MARKER
===================================================== */

const testMarker = L.marker([49.806, 8.738])
    .addTo(map)
    .bindPopup("Testposition");


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById("btnRoute").addEventListener("click", () => {
    console.log("Route Button");
});

document.getElementById("btnNav").addEventListener("click", () => {
    map.setView(testMarker.getLatLng(), 16);
});

document.getElementById("btnToggle").addEventListener("click", () => {

    const go = document.getElementById("iconGo");
    const br = document.getElementById("iconBreak");

    if (go.style.display !== "none") {
        go.style.display = "none";
        br.style.display = "inline";
    } else {
        go.style.display = "inline";
        br.style.display = "none";
    }
});

document.getElementById("btnExit").addEventListener("click", () => {
    console.log("Exit");
});

</script>

</body>
</html>
