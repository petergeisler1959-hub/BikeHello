<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BikeHello</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }


    /* =========================================================
       SCREENS
       ========================================================= */

    .screen {
      display: none;
      width: 100%;
      height: 100dvh;
      min-height: 0;
    }

    .screen.is-active {
      display: flex;
    }


    /* =========================================================
       COCKPIT
       ========================================================= */

    #cockpitScreen {
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }

    #mapWrapper {
      position: relative;
      flex: none;
      height: 50%;
      min-height: 0;
      padding: 10px;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    .route-recalculate-button {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 1000;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: white;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }

    .route-recalculate-button:active {
      transform: scale(.97);
    }

    #bottomPanel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 30px 18px 12px;
      background: rgba(255,255,255,.96);
    }

    #vitaldaten,
    #sensorBottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vital-item,
    .sensor-item {
      display: flex;
      flex-direction: column;
    }

    .vital-label,
    .sensor-label {
      color: #666;
      font-size: 13px;
    }

    .vital-value,
    .sensor-value {
      margin-top: 1px;
      font-size: 24px;
      font-weight: 600;
    }

    .secondary-value {
      margin-left: 5px;
      color: #888;
      font-size: 16px;
      font-weight: 400;
    }

    .data-paused {
      color: #999 !important;
    }

    #controlBar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.98);
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
    }


    /* =========================================================
       Karte wird im Zoom-Modus über 72% der gesamten Höhe
       gelegt. Der untere Teil wird später durch die Werte überdeckt
       ========================================================= */

    #cockpitScreen.zoom-layout-test {
      position: relative;
    }

    #cockpitScreen.zoom-layout-test #mapWrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 72%;
      padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
      z-index: 1;
    }

    #cockpitScreen.zoom-layout-test #bottomPanel {
      display: grid;
      position: absolute;
      left: 0;
      right: 0;
      top: 51.8%;
      z-index: 10;
      padding-top: 37px;
    }

    #cockpitScreen.zoom-layout-test #btnRecalculateRoute {
      top: calc(51.8% + 73px);
      bottom: auto;
      left: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .button {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 9px;
      background: #c3e2c8;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      color: #2f6fed;
    }

    #routeProfileIconImage {
      width: 36px;
      height: 36px;
      display: block;
      margin: 0 auto;
    }

    .button.disabled {
      opacity: .35;
      filter: grayscale(1);
      pointer-events: none;
    }

    .status-bike {
      font-size: 38px;
      line-height: 1;
    }

    .gps-dot,
    .gps-arrow {
      background: transparent;
      border: 0;
    }

    .gps-dot div {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #2e7d32;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      transform-origin: center;
    }

    .gps-arrow div {
      width: 0;
      height: 0;
      border-right: 10px solid transparent;
      border-bottom: 26px solid #2e7d32;
      border-left: 10px solid transparent;
      filter: drop-shadow(0 1px 2px #fff);
      transform-origin: center;
    }

    .route-cockpit-marker {
      position: relative;
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
    }

    .route-cockpit-marker::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 6.5px;
      top: 6.5px;
      background: #fff;
      border-radius: 50%;
    }

    .route-cockpit-marker.start {
      background: #d9534f;
    }

    .route-cockpit-marker.target {
      background: #3aaa35;
    }

    /* Marker in den großen START-/ZIEL-Kreisen */
    .route-point-circle .route-cockpit-marker {
      width: 30px;
      height: 30px;
    }

    .route-point-circle .route-cockpit-marker::after {
      width: 8px;
      height: 8px;
      left: 8px;
      top: 8px;
    }


    /* =========================================================
       ROUTE SCREEN
       ========================================================= */

    #routeScreen {
      flex-direction: column;
      min-height: 0;
      overflow: hidden;

      background: #f8faf8;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .route-page-header {
      flex: none;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;
    }

    .route-page-title {
      margin: -10px;

      color: #444;

      font-size: 22px;
      font-weight: 600;
    }


    /* =========================================================
       BODY
       ========================================================= */

    .route-page-body {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 4px 0 0;
    }


    /* =========================================================
       START / ZIEL
       ========================================================= */

    .route-definition {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      width: 100%;
      max-width: 600px;

      margin: 0 auto 24px;
    }

    .route-point {
      display: flex;
      flex: none;

      flex-direction: column;
      align-items: center;

      width: clamp(145px, 39vw, 165px);
    }


    .route-point-circle {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: clamp(145px, 39vw, 165px);
      height: clamp(145px, 39vw, 165px);

      padding: 0;

      overflow: hidden;

      border: 2px solid rgba(80,80,80,.55);
      border-radius: 50%;

      background: rgba(255,255,255,.92);

      color: #555;

      cursor: pointer;
    }

    .route-point-circle:focus-visible {
      outline: 3px solid #2f6fed;
      outline-offset: 3px;
    }


    /* =========================================================
       MINI MAP
       ========================================================= */

    .route-mini-map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }

    .route-point-circle.has-location
    .route-mini-map {
      opacity: 1;
    }


    /* =========================================================
       CIRCLE CONTENT
       ========================================================= */

    .route-circle-content {
      position: relative;
      z-index: 10;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding: 12px;

      border-radius: 50%;

      background: rgba(255,255,255,.88);
    }

    .route-point-circle.has-location
    .route-circle-content {
      background: rgba(255,255,255,.20);
    }


    /* =========================================================
       START / TARGET MARKER
       ========================================================= */

    .route-marker {
      width: 25px;
      height: 25px;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);
    }

    .start-marker {
      background: #d9534f;
    }

    .target-marker {
      background: #3aaa35;
    }


    /* =========================================================
       TEXT IN CIRCLE
       ========================================================= */

    .route-point-text {
      margin-top: 8px;

      font-size: 19px;
      font-weight: 700;

      text-align: center;

      text-shadow:
        0 1px 2px rgba(255,255,255,.9);
    }


    /* =========================================================
       NAME / ADDRESS UNDER CIRCLE
       ========================================================= */

    .route-selected-info {
      display: none;

      width: 100%;

      min-height: 38px;

      margin-top: 9px;

      text-align: center;

      line-height: 1.2;

      text-shadow:
        0 1px 2px rgba(255,255,255,.95);
    }

    .route-point.has-location
    .route-selected-info {
      display: block;
    }

    .route-selected-info-name {
      color: #444;

      font-size: 15px;
      font-weight: 700;
    }

    .route-selected-info-address {
      min-height: 15px;

      margin-top: 2px;

      color: #777;

      font-size: 12px;
      font-weight: 400;
    }


    /* =========================================================
       CONNECTION / PFEIL
       ========================================================= */

    .route-connection {
      position: relative;

      flex: 1;

      max-width: 105px;
      min-width: 15px;

      height: 8px;

      margin: 72px 8px 0;

      border-radius: 4px;

      background: #2f6fed;
    }

    .route-connection::after {
      content: "";

      position: absolute;

      right: 0px;
      top: 50%;

      width: 14px;
      height: 14px;

      border-top: 7px solid #2f6fed;
      border-right: 7px solid #2f6fed;

      transform:
        translateY(-50%)
        rotate(45deg);

      border-radius: 1px;
    }


    /* =========================================================
       INPUT PANEL
       ========================================================= */

    .route-input-panel {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding: 14px 14px 15px;

      border:
        1px solid
        rgba(120,120,120,.45);

      border-radius: 12px;

      background:
        rgba(255,255,255,.95);
    }

    .route-input-panel.is-open {
      display: block;
    }

    .route-input-title {
      margin-bottom: 9px;

      color: #666;

      font-size: 17px;
      line-height: 1.2;

      font-weight: 700;
    }

    .route-input-row {
      display: flex;
      align-items: center;

      min-height: 46px;

      border:
        1px solid
        #aaa;

      border-radius: 9px;

      background: #fff;

      padding-left: 12px;
    }

    #routeInput {
      flex: 1;

      min-width: 0;

      height: 44px;

      border: 0;
      outline: 0;

      color: #444;

      background: transparent;

      font-size: 16px;
    }


    /* =========================================================
       SEARCH / MEIN STANDORT BUTTON
       ========================================================= */

    #btnRouteSearch {
      display: none;

      flex: none;

      width: 62px;
      height: 38px;

      margin-right: 3px;

      padding: 0;

      border:
        1px solid
        rgba(0,0,0,.18);

      border-radius: 8px;

      background: #f7f7f7;

      color: #444;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }


    #btnRouteSearch.is-visible {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 2px;

      font-size: 17px;
    }


    /* =========================================================
       CANDIDATES
       ========================================================= */

    #routeCandidates {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 18px auto 0;
    }

    #routeCandidates.is-visible {
      display: block;
    }

    .route-candidate {
      display: flex;

      align-items: center;

      width: 100%;

      margin-bottom: 7px;

      padding: 9px 12px;

      border:
        1px solid
        #b8b8b8;

      border-radius: 9px;

      background: #fff;

      box-shadow:
        0 2px 5px rgba(0,0,0,.08);

      box-sizing: border-box;
    }

    .route-candidate-select {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;

      padding: 0;

      border: none;

      background: transparent;

      text-align: left;

      font: inherit;

      color: inherit;
    }


    .route-candidate-save {
      flex: none;

      width: 44px;
      height: 44px;

      margin-left: 10px;

      padding: 0;

      border: none;

      border-radius: 0;

      background: transparent;

      font-size: 22px;

      line-height: 1;

      text-align: center;

      cursor: pointer;
    }

    .route-candidate-name {
      display: block;

      color: #555;

      font-size: 16px;
      line-height: 1.2;

      font-weight: 700;
    }

    .route-candidate-address {
      display: block;

      margin-top: 3px;

      color: #777;

      font-size: 13px;
      line-height: 1.2;
    }

    .route-candidate:active {
      background: #f0f5ff;
    }


    /* =========================================================
       ROUTE BERECHNEN
       ========================================================= */

    #routeCalculateButton {
      display: none;

      width: 100%;
      max-width: 600px;

      min-height: 52px;

      margin: 18px auto 0;

      border:
        1px solid
        rgba(47,111,237,.45);

      border-radius: 9px;

      background:
        #dce9ff;

      color:
        #2455a7;

      box-shadow:
        0 4px 10px rgba(0,0,0,.18);

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;
    }

    #routeCalculateButton.is-visible {
      display: block;
    }


    /* =========================================================
       BOTTOM BUTTONS
       ========================================================= */

    .route-page-actions {
      flex: none;

      display: flex;

      justify-content: space-between;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      gap: 10px;

      padding:
        12px
        0
        7px;

      background: #f8faf8;
    }

    .route-page-actions button {
      flex: 0 0 auto;

      min-width: 0;
      min-height: 52px;

      padding: 0 16px;

      border: 1px solid rgba(0,0,0,.25);

      border-radius: 9px;

      box-shadow:
        0 4px 10px rgba(0,0,0,.18);

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       ORT SPEICHERN – DIALOG
       ========================================================= */

    .save-place-dialog {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 1000;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.45);
    }

    .save-place-dialog.keyboard-open {
      transform: translateY(-50px);
    }


    .save-place-dialog-content {
      width: 100%;
      max-width: 500px;

      padding: 24px;

      background: #ffffff;
      border-radius: 14px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.30);

      box-sizing: border-box;
    }


    .save-place-dialog-content h2 {
      margin: 0 0 22px;

      text-align: center;

      font-size: 22px;
    }


    .save-place-dialog-content label {
      display: block;

      margin: 0 0 6px;

      font-size: 16px;
      font-weight: 700;
    }


    .save-place-dialog-content input {
      display: block;

      width: 100%;
      box-sizing: border-box;

      min-height: 46px;

      margin: 0 0 16px;
      padding: 0 12px;

      border: 1px solid rgba(0, 0, 0, 0.30);
      border-radius: 8px;

      background: #ffffff;

      font-size: 17px;
    }


    .save-place-dialog-content input:disabled {
      background: #eeeeee;
      color: #666666;
    }

    .save-place-dialog-content input:disabled.has-value {
      background: #ffffff;
      color: #333333;
      opacity: 1;

      -webkit-text-fill-color: #333333;
    }


    .save-place-dialog-actions {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin-top: 8px;
    }


    .save-place-dialog-actions button {
      flex: 1;

      min-height: 48px;

      padding: 0 14px;

      border: 1px solid rgba(0, 0, 0, 0.25);
      border-radius: 9px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }


    #btnSavePlaceConfirm:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .saved-places-heading {
      width: 100%;
      margin-bottom: 8px;
      color: #555;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
    }


    /* =========================================================
       MINI MAP MARKER
       ========================================================= */

    .route-mini-map
    .leaflet-control-attribution {
      font-size: 6px;
      line-height: 8px;

      background:
        rgba(255,255,255,.65);
    }

    .route-mini-marker {
      position: relative;
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
      background: #d9534f;
    }

    .route-mini-marker::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
    }

    .route-mini-marker.start {
      background: #d9534f;
    }

    .route-mini-marker.target {
      background: #3aaa35;
    }


    /* =========================================================
       SMALL SCREENS
       ========================================================= */

    @media (max-width: 370px) {

      .route-point,
      .route-point-circle {
        width: 135px;
      }

      .route-point-circle {
        height: 135px;
      }

      .route-connection {
        max-width: 70px;
        margin-left: 5px;
        margin-right: 5px;
      }

      .route-page-actions button {
        font-size: 16px;
      }

    }

    /* =========================================================
       SPEICHER-HINWEIS
       ========================================================= */

    .save-place-toast {
      display: none;

      position: fixed;

      left: 50%;
      bottom: 90px;

      transform: translateX(-50%);

      z-index: 1000;

      padding: 12px 20px;

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

  </style>

</head>

<body>

  <!-- =========================================================
       COCKPIT
       ========================================================= -->

  <main
    id="cockpitScreen"
    class="screen is-active"
  >

  <div id="mapWrapper">
    <div id="map"></div>
    <button
      id="btnRecalculateRoute"
      class="route-recalculate-button"
      type="button"
      /*hidden*/
    >
      Route: ?
    </button>
  </div>


<section id="bottomPanel">

  <div id="vitaldaten">

    <div class="vital-item">
      <span class="vital-label">Speed</span>
      <span
        class="vital-value"
        id="vSpeed"
      >
        22.5 km/h
      </span>
    </div>

    <div class="vital-item">
      <span class="vital-label">Altitude</span>
      <span
        class="vital-value"
        id="vAltitude"
      >
        236 m
      </span>
    </div>

    <div class="vital-item">
      <span class="vital-label">Distance</span>
      <span class="vital-value">
        <span id="vDistLeft">38.8</span>
        <span
          class="secondary-value"
          id="vDistTotal"
        >(52.3)</span>
      </span>
    </div>

    <div class="vital-item">
      <span class="vital-label">Time</span>
      <span class="vital-value">
        <span id="vTimeLeft">3:50</span>
        <span
          class="secondary-value"
          id="vTimeTotal"
        >(5:12)</span>
      </span>
    </div>

  </div>


  <div id="sensorBottom">

    <div class="sensor-item">
      <span class="sensor-label">Power</span>
      <span class="sensor-value">245 W</span>
    </div>

    <div class="sensor-item">
      <span class="sensor-label">Battery</span>
      <span class="sensor-value">67 %</span>
    </div>

    <div class="sensor-item">
      <span class="sensor-label">Range</span>
      <span class="sensor-value">54 km</span>
    </div>

    <div class="sensor-item">
      <span class="sensor-label">Diagnose</span>
      <span
        class="sensor-value"
        id="diagnosisValue"
      >
        - | -
      </span>
    </div>

  </div>

</section>


<nav
  id="controlBar"
  aria-label="Bedienung"
>

  <!-- LINKS: MAP -->
  <div class="control-group">

    <span class="control-label">
      MAP
    </span>

    <button
      id="btnView"
      class="button"
      type="button"
    >
      Zoom
    </button>

  </div>


  <!-- MITTE: ROUTE-PROFIL -->
  <div class="control-group">

    <span class="control-label">
      ROUTE TYPE
    </span>

    <button
      id="btnRouteProfile"
      class="button"
      type="button"
    >

<span id="iconRouteProfile">
  <img
    id="routeProfileIconImage"
    src="icons/road.svg"
    alt=""
  >
</span>

    </button>

  </div>


  <!-- RECHTS: ROUTE -->
  <div class="control-group">

    <span class="control-label">
      ROUTE
    </span>

    <button
      id="btnNewRoute"
      class="button"
      type="button"
    >

function getDistanceToRoute(lat, lon) {

  if (!testRouteLine) {
    return null;
  }

  const routePoints =
    testRouteLine.getLatLngs();

  if (
    !routePoints ||
    routePoints.length < 2
  ) {
    return null;
  }

  const gpsPoint =
    L.latLng(lat, lon);

  let minDistance = Infinity;
  let nearestPointIndex = 0;

  for (
    let i = 0;
    i < routePoints.length - 1;
    i++
  ) {

    const a =
      routePoints[i];

    const b =
      routePoints[i + 1];

    const segmentDistance =
      distancePointToSegment(
        gpsPoint,
        a,
        b
      );

    if (segmentDistance < minDistance) {

      minDistance =
        segmentDistance;

      /*
         Wir merken uns zunächst
         den Startpunkt des nächstgelegenen
         Routensegments.
      */

      nearestPointIndex = i;

    }
  }

  if (!isFinite(minDistance)) {
    return null;
  }

  return {
    index: nearestPointIndex,
    distance: minDistance,
    totalPoints: routePoints.length,
    totalDistance:
      activeRouteType === "street"
        ? streetRoute.distance
        : natureRoute.distance
  };
}

function getRemainingRouteDistance(
  actualPoint
) {

  if (!testRouteLine) {
    return null;
  }

  const routePoints =
    testRouteLine.getLatLngs();

  if (
    !routePoints ||
    routePoints.length < 2
  ) {
    return null;
  }

  if (
    actualPoint < 0 ||
    actualPoint >= routePoints.length
  ) {
    return null;
  }

  let remainingDistance = 0;

  for (
    let i = actualPoint;
    i < routePoints.length - 1;
    i++
  ) {

    remainingDistance +=
      routePoints[i].distanceTo(
        routePoints[i + 1]
      );

  }

  return remainingDistance;
}


function getDistanceToRouteWindow(
  lat,
  lon
) {

  if (!testRouteLine) {
    return null;
  }

  const routePoints =
    testRouteLine.getLatLngs();

  if (
    !routePoints ||
    routePoints.length < 2
  ) {
    return null;
  }


  /* ---------------------------------------------------------
     Eigenes Suchfenster für Straße und Natur
     --------------------------------------------------------- */

  const routeWindowCenter =
    activeRouteType === "street"
      ? streetRouteWindowCenter
      : natureRouteWindowCenter;


  const centerIndex =
    Math.max(
      0,
      Math.min(
        routePoints.length - 1,
        routeWindowCenter - 1
      )
    );


  /* ---------------------------------------------------------
     Testfenster: -30 ... +100 Punkte
     --------------------------------------------------------- */

  const startIndex =
    Math.max(
      0,
      centerIndex - 30
    );

  const endIndex =
    Math.min(
      routePoints.length - 1,
      centerIndex + 100
    );


  return {
    startIndex: startIndex,
    endIndex: endIndex,
    totalPoints: routePoints.length
  };

}


function distancePointToSegment(
  point,
  a,
  b
) {

  const ax = a.lng;
  const ay = a.lat;

  const bx = b.lng;
  const by = b.lat;

  const px = point.lng;
  const py = point.lat;

  const dx = bx - ax;
  const dy = by - ay;

  if (dx === 0 && dy === 0) {
    return point.distanceTo(a);
  }

  const t =
    Math.max(
      0,
      Math.min(
        1,
        (
          (px - ax) * dx +
          (py - ay) * dy
        ) /
        (dx * dx + dy * dy)
      )
    );

  const nearest =
    L.latLng(
      ay + t * dy,
      ax + t * dx
    );

  return point.distanceTo(nearest);
}

    /* =========================================================
       ORTE-SPEICHER ANZEIGEN
       ========================================================= */

    function showSavedPlaces() {

      const places =
        loadSavedPlaces();

      if (places.length === 0) {

        routeCandidates.innerHTML = `
          <div class="route-candidate">
            <span class="route-candidate-name">
              Keine gespeicherten Orte
            </span>
          </div>
        `;

        routeCandidates.classList.add(
          "is-visible"
        );

        return;
      }

      routeCandidates.innerHTML = 
      `
        <div class="saved-places-heading">
          Gespeicherte Orte
        </div>
      ` +
        places
          .map((place, index) => {

            const ownName =
              place.ownName || "";

            const description =
              place.description || "";

            const address =
              place.address || "";

            const descriptionIsInAddress =
              description &&
              address &&
              address
                .toLowerCase()
                .includes(
                  description.toLowerCase()
                );

            let firstLine = "";
            let secondLine = "";

            if (ownName) {
              firstLine = ownName;

              secondLine =
                description &&
                !descriptionIsInAddress
                  ? description
                  : "";
            } else {
              firstLine =
                description &&
                !descriptionIsInAddress
                  ? description
                  : address ||
                    "Unbenannter Ort";
            }

            const createdDate =
              place.createdAt
                ? new Date(
                    place.createdAt
                  ).toLocaleDateString(
                    "de-DE"
                  )
                : "";

            const usageCount =
              Number.isFinite(
                place.useCount
              )
                ? place.useCount
                : 0;

            const meta =
              createdDate
                ? `Erstellt: ${createdDate} &#x2192; Nutzungen: ${usageCount}`
                : `Nutzungen: ${usageCount}`;

            return `
              <div
                class="route-candidate"
                data-place-index="${index}"
              >

                <button
                  class="route-candidate-select"
                  type="button"
                >

                  <span
                    class="route-candidate-name"
                  >
                    ${firstLine}
                  </span>

                  ${
                    secondLine
                      ? `
                        <span
                          class="route-candidate-description"
                        >
                          ${secondLine}
                        </span>
                      `
                      : ""
                  }

                  ${
                    address
                      ? `
                        <span
                          class="route-candidate-address"
                        >
                          ${address}
                        </span>
                      `
                      : ""
                  }

                  <span
                    class="route-candidate-address"
                  >
                    ${meta}
                  </span>

                </button>

                <div
                  class="route-place-actions"
                >

                  <button
                    class="route-place-edit"
                    type="button"
                    data-place-index="${index}"
                    aria-label="Ort bearbeiten"
                  >
                    &#x270F;&#xFE0F;
                  </button>

                  <button
                    class="route-place-delete"
                    type="button"
                    data-place-index="${index}"
                    aria-label="Ort l&#x00F6;schen"
                  >
                    &#x1F5D1;&#xFE0F;
                  </button>

                </div>

              </div>
            `;
          })
          .join("");

      routeCandidates.classList.add(
        "is-visible"
      );

      attachSavedPlaceHandlers();

    }

    function attachSavedPlaceHandlers() {

      routeCandidates
        .querySelectorAll(".route-candidate-select")
        .forEach(button => {

          button.addEventListener("click", () => {

            const candidate =
              button.closest(".route-candidate");

            if (!candidate) {
              return;
            }

            const index =
              Number(

    function formatCandidateAddress(hit) {
      const street =
        hit.street
          ? `${hit.street}${hit.housenumber || hit.house_number ? ` ${hit.housenumber || hit.house_number}` : ""}`
          : "";

      const city =
        [hit.postcode, hit.city]
          .filter(Boolean)
          .join(" ");

      const parts =
        [street, city]
          .filter(Boolean);

      if (parts.length > 0) {
        return parts.join(", ");
      }

      return [hit.district, hit.state, hit.country]
        .filter(Boolean)
        .join(", ");
    }

    function formatRouteTime(
      minutes
    ) {

      const totalMinutes =
        Math.max(
          1,
          Math.round(minutes)
        );


      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const remainingMinutes =
        totalMinutes % 60;


      if (hours > 0) {

        return `${hours}:${String(
          remainingMinutes
        ).padStart(2, "0")}`;

      }


      return `0:${String(
        remainingMinutes
      ).padStart(2, "0")}`;

    }


async function calculateGraphHopperRoute() {

  if (

  if (

    GRAPHHOPPER_API_KEY === "YOUR_GRAPHHOPPER_API_KEY"

  /*
     Alte gespeicherte Routen ebenfalls verwerfen.
     Erst wenn beide neuen Routen erfolgreich berechnet
     wurden, werden sie wieder gesetzt.
  */

  streetRoute = null;

  natureRouteWindowCenter = 1;


  try {

    /* =========================================================
       HILFSFUNKTION FÜR EINE GRAPHHOPPER-ROUTE
       ========================================================= */

    async function requestRoute(profile) {

      const url =
        "https://graphhopper.com/api/1/route" +
        `?point=${selectedStart.lat},${selectedStart.lon}` +
        `&point=${selectedTarget.lat},${selectedTarget.lon}` +
        `&profile=${profile}` +
        `&locale=de` +
        `&points_encoded=false` +
        `&instructions=false` +
        `&key=${encodeURIComponent(GRAPHHOPPER_API_KEY)}`;


      /* Jeder tatsächliche GraphHopper-Request zählt als 1 Request. */
      increaseRequestCount();


      const response =
        await fetch(url);


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          `${profile}: HTTP ${response.status}: ${errorText}`
        );

      }


      const data =
        await response.json();


      if (
        !data.paths ||
        !data.paths.length
      ) {

        throw new Error(
          `${profile}: GraphHopper hat keine Route geliefert.`
        );

      }


      const path =
        data.paths[0];


      /* ---------------------------------------------------------
         ROUTENGEOMETRIE
         --------------------------------------------------------- */

      const coordinates =
        path.points?.coordinates;


      if (
        !Array.isArray(coordinates) ||
        coordinates.length < 2
      ) {

        throw new Error(
          `${profile}: Keine gültige Routengeometrie erhalten.`
        );

      }


      /*
         GraphHopper liefert:
         [longitude, latitude]

         Leaflet benötigt:
         [latitude, longitude]
      */

      const routeLatLngs =
        coordinates.map(
          ([lon, lat]) =>
            [lat, lon]
        );


      return {

        points: routeLatLngs,

        distance:
          Number(path.distance)

      };

    }

          `(${distanceKm.toFixed(1)})`;

        document.getElementById(
          "routeProfileIconImage"
        ).src =
          activeRouteType === "street"
            ? "icons/road.svg"
            : "icons/trees.svg";

        requestAnimationFrame(
          () => {
            map.invalidateSize(true);
          }
        );

      }
    );


    updateUI();



    /* =========================================================
       GPS
       ========================================================= */

    try {

      const GPS =
        registerPlugin("GPS");


      GPS.addListener(
        "gpsData",
        data => {

          document.getElementById(
            "vSpeed"
          ).textContent =
            `${(data.speed * 3.6).toFixed(1)} km/h`;


          document.getElementById(
            "vAltitude"
          ).textContent =
            `${data.altitude.toFixed(0)} m`;


          const position = [
            data.lat,
            data.lon
          ];


          const speedKmh =
            (Number(data.speed) || 0) *
            3.6;


const routeDistance =
  getDistanceToRoute(
    data.lat,
    data.lon
  );

const routeWindowDistance =
  getDistanceToRouteWindow(
    data.lat,
    data.lon
  );


if (
  diagnosisValue &&
  routeDistance &&
  routeWindowDistance
) {

  const actualPoint =
    routeDistance.index;

const totalDistance =
  routeDistance.totalDistance;

const remainingDistance =
  getRemainingRouteDistance(
    actualPoint
  );

const averageSpeed =
  19;

const totalTimeMinutes =
  totalDistance /
  1000 /
  averageSpeed *
  60;

document.getElementById(
  "vDistLeft"
).textContent =
  (remainingDistance / 1000).toFixed(1);

document.getElementById(
  "vDistTotal"
).textContent =
  `(${(totalDistance / 1000).toFixed(1)})`;

const remainingTimeMinutes =
  remainingDistance /
  1000 /
  averageSpeed *
  60;

function formatTime(
  totalMinutes
) {

  const hours =
    Math.floor(
      totalMinutes / 60
    );

  const minutes =
    Math.round(
      totalMinutes % 60
    );

  return (
    hours +
    ":" +
    String(minutes).padStart(2, "0")
  );
}


document.getElementById(
  "vTimeLeft"
).textContent =
  formatTime(
    remainingTimeMinutes
  );

document.getElementById(
  "vTimeTotal"
).textContent =
  `(${formatTime(
    totalTimeMinutes
  )})`;


  const windowStart =
    routeWindowDistance.startIndex;

  const windowEnd =
    routeWindowDistance.endIndex;

  const insideWindow =
    actualPoint >= windowStart &&
    actualPoint <= windowEnd;


  diagnosisValue.textContent =
    `${windowStart}-${windowEnd} | ` +
    `${(routeDistance.totalPoints - 1).toLocaleString("de-DE")}`;


  if (routeButton) {

    routeButton.textContent =
      `#${actualPoint} → ` +
      `${Math.round(routeDistance.distance)} m`;

    routeButton.style.background =
      insideWindow
        ? "#2f6fed"
        : "#d9534f";

  }


  if (insideWindow) {

    if (activeRouteType === "street") {

      streetRouteWindowCenter =
        actualPoint;

    } else {

      natureRouteWindowCenter =
        actualPoint;

    }

  }

}


          if (!gpsMarker) {

            gpsMarker =
              L.marker(
                position,
                {
                  icon: gpsDotIcon,
                  zIndexOffset: 1000
                }
              ).addTo(map);

          } else {

            gpsMarker.setLatLng(
              position
            );


            gpsMarker.setIcon(
              speedKmh >= 2
                ? gpsArrowIcon
                : gpsDotIcon
            );

          }


          if (
            data.courseValid &&
            gpsMarker
          ) {

            const arrow =
              gpsMarker
                .getElement()
                ?.querySelector("div");


            if (arrow) {

              arrow.style.transform =
                mapView === "Zoom"
                ? "rotate(0deg)"
                : `rotate(${data.course}deg)`;

            }
          }


if (
  mapView === "Zoom"
) {

  map.setView(
    position,
    17,
    {
      animate: false
    }
  );

  if (data.courseValid) {

    map.setHeading(
      data.course
    );

  }

}

          if (!mapCenteredOnGps) {

            mapCenteredOnGps = true;

            setTimeout(
              () => {

                map.setView(
                  position,
                  17
                );


              },
              1000
            );

          }


        lastGpsData = data;

        }
      );


      setTimeout(
        () =>
          GPS.start().catch(
            () => {}
          ),
        500
      );

    } catch (_) {

      /* Browser-Vorschau ohne Capacitor */

    }

  </script>

  <!-- =======================================================
       SPEICHER-HINWEIS
       ======================================================= -->

  <div
    id="savePlaceToast"
    class="save-place-toast"
  >
    Standort gespeichert
  </div>


</body>
</html>
