<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BikeHello</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }


    /* =========================================================
       SCREENS
       ========================================================= */

    .screen {
      display: none;
      width: 100%;
      height: 100dvh;
      min-height: 0;
    }

    .screen.is-active {
      display: flex;
    }


    /* =========================================================
       COCKPIT
       ========================================================= */

    #cockpitScreen {
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }

    #mapWrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 10px;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    #bottomPanel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 12px 18px;
      background: rgba(255,255,255,.96);
    }

    #vitaldaten,
    #sensorBottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vital-item,
    .sensor-item {
      display: flex;
      flex-direction: column;
    }

    .vital-label,
    .sensor-label {
      color: #666;
      font-size: 13px;
    }

    .vital-value,
    .sensor-value {
      margin-top: 1px;
      font-size: 24px;
      font-weight: 600;
    }

    .secondary-value {
      margin-left: 5px;
      color: #888;
      font-size: 16px;
      font-weight: 400;
    }

    .data-paused {
      color: #999 !important;
    }

    #controlBar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.98);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .button {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 9px;
      background: #c3e2c8;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
    }

    .button.disabled {
      opacity: .35;
      filter: grayscale(1);
      pointer-events: none;
    }

    #btnToggle {
      background: #f5f5f5;
    }

    #btnToggle.status-active {
      border: 3px solid #555;
    }

    .status-bike {
      font-size: 38px;
      line-height: 1;
    }

    .gps-dot,
    .gps-arrow {
      background: transparent;
      border: 0;
    }

    .gps-dot div {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #2e7d32;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      transform-origin: center;
    }

    .gps-arrow div {
      width: 0;
      height: 0;
      border-right: 10px solid transparent;
      border-bottom: 26px solid #2e7d32;
      border-left: 10px solid transparent;
      filter: drop-shadow(0 1px 2px #fff);
      transform-origin: center;
    }


    /* =========================================================
       ROUTE SCREEN
       ========================================================= */

    #routeScreen {
      position: relative;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;

      background: #f8faf8;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);
    }


    /* ---------------------------------------------------------
       HEADER
       --------------------------------------------------------- */

    .route-page-header {
      flex: none;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 46px;
    }

    .route-page-title {
      margin: 0;

      color: #444;

      font-size: 21px;
      font-weight: 600;
    }


    /* ---------------------------------------------------------
       BODY
       --------------------------------------------------------- */

    .route-page-body {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 0 0 6px;
    }


    /* =========================================================
       START / ZIEL
       ========================================================= */

    .route-definition {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      max-width: 600px;

      margin: 0 auto 18px;
    }

    .route-point {
      display: flex;
      flex: none;

      flex-direction: column;
      align-items: center;
    }


    /*
       DIE KREISE

       Vor Auswahl:
       - weiß
       - Marker
       - START / ZIEL

       Nach Auswahl:
       - Mini-Karte
       - Positionspunkt
       - Name
    */

    .route-point-circle {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: clamp(96px, 25vw, 112px);
      height: clamp(96px, 25vw, 112px);

      padding: 0;

      overflow: hidden;

      border: 2px solid rgba(80,80,80,.55);
      border-radius: 50%;

      background: rgba(255,255,255,.92);

      color: #555;

      cursor: pointer;
    }

    .route-point-circle:focus-visible {
      outline: 3px solid #2f6fed;
      outline-offset: 3px;
    }


    /* ---------------------------------------------------------
       MINI MAP
       --------------------------------------------------------- */

    .route-mini-map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }

    .route-point-circle.has-location
    .route-mini-map {
      opacity: 1;
    }


    /* ---------------------------------------------------------
       KREIS-INHALT
       --------------------------------------------------------- */

    .route-circle-content {
      position: relative;
      z-index: 10;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding: 8px;

      border-radius: 50%;

      background: rgba(255,255,255,.88);
    }

    .route-point-circle.has-location
    .route-circle-content {
      background: rgba(255,255,255,.20);
    }


    /* ---------------------------------------------------------
       START/ZIEL MARKER
       --------------------------------------------------------- */

    .route-marker {
      width: 21px;
      height: 21px;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);
    }

    .start-marker {
      background: #d9534f;
    }

    .target-marker {
      background: #3aaa35;
    }


    /* ---------------------------------------------------------
       TEXT IM KREIS
       --------------------------------------------------------- */

    .route-point-text {
      margin-top: 6px;

      font-size: 16px;
      font-weight: 700;

      text-align: center;

      text-shadow:
        0 1px 2px rgba(255,255,255,.9);
    }

    /*
       Nach Auswahl wird der Kandidatenname angezeigt.
       Etwas kleiner, damit auch längere Namen passen.
    */

    .route-selected-name {
      display: none;

      max-width: 88%;

      margin-top: 5px;

      color: #444;

      font-size: 12px;
      line-height: 1.15;

      font-weight: 700;

      text-align: center;

      text-shadow:
        0 1px 2px rgba(255,255,255,.95);
    }

    .route-point-circle.has-location
    .route-selected-name {
      display: block;
    }

    .route-point-circle.has-location
    .route-point-text {
      display: none;
    }


    /* ---------------------------------------------------------
       BLAUE VERBINDUNG
       --------------------------------------------------------- */

    .route-connection {
      flex: 1;

      max-width: 150px;
      min-width: 25px;

      height: 5px;

      margin:
        0
        9px
        0;

      border-radius: 3px;

      background: #2f6fed;
    }


    /* =========================================================
       INPUT PANEL
       ========================================================= */

    .route-input-panel {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding: 9px 12px;

      border:
        1px solid
        rgba(120,120,120,.45);

      border-radius: 12px;

      background:
        rgba(255,255,255,.95);
    }

    .route-input-panel.is-open {
      display: block;
    }

    .route-input-title {
      margin-bottom: 5px;

      color: #666;

      font-size: 14px;
      font-weight: 700;
    }

    .route-input-row {
      display: flex;
      align-items: center;

      min-height: 40px;

      border:
        1px solid
        #bbb;

      border-radius: 8px;

      background: #fff;

      padding-left: 10px;
    }

    #routeInput {
      flex: 1;

      min-width: 0;

      height: 38px;

      border: 0;
      outline: 0;

      color: #444;

      background: transparent;
    }

    #btnRouteSearch {
      display: none;

      flex: none;

      width: 44px;
      height: 34px;

      margin-right: 3px;

      border: 0;

      border-radius: 7px;

      background: #eaf2ff;

      color: #2455a7;

      cursor: pointer;
    }

    #btnRouteSearch.is-visible {
      display: block;
    }


    /* =========================================================
       KANDIDATEN
       ========================================================= */

    #routeCandidates {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 7px auto 0;
    }

    #routeCandidates.is-visible {
      display: block;
    }

    .route-candidate {
      width: 100%;

      margin-bottom: 4px;

      padding: 7px 10px;

      border:
        1px solid
        #bbb;

      border-radius: 8px;

      background: #fff;

      cursor: pointer;

      text-align: left;
    }

    .route-candidate-name {
      display: block;

      color: #555;

      font-size: 15px;
      line-height: 1.15;

      font-weight: 700;
    }

    .route-candidate-address {
      display: block;

      margin-top: 1px;

      color: #777;

      font-size: 12px;
      line-height: 1.15;
    }

    .route-candidate:active {
      background: #f0f5ff;
    }


    /* =========================================================
       BOTTOM BUTTONS
       ========================================================= */

    .route-page-actions {
      flex: none;

      display: flex;

      justify-content: center;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      gap: 10px;

      padding:
        15px
        0
        6px;

      background: #f8faf8;
    }

    .route-page-actions button {
      flex: 1;

      min-width: 0;

      min-height: 46px;

      font-size: 16px;
    }


    /* ---------------------------------------------------------
       ROUTENLISTE
       --------------------------------------------------------- */

    #btnRouteList {
      border-color:
        rgba(47,111,237,.45);

      background:
        #eef4ff;

      color:
        #285aa8;
    }


    /* ---------------------------------------------------------
       CANCEL
       --------------------------------------------------------- */

    #btnRouteCancel {
      border-color:
        rgba(190,70,70,.40);

      background:
        #fff1f1;

      color:
        #a04444;
    }


    /* =========================================================
       MINI-MAP MARKER
       ========================================================= */

    .route-mini-map
    .leaflet-control-attribution {
      font-size: 6px;
      line-height: 8px;

      background:
        rgba(255,255,255,.65);
    }

    .route-mini-marker {
      width: 14px;
      height: 14px;

      border: 2px solid #fff;

      border-radius: 50%;

      background: #d9534f;

      box-shadow:
        0 1px 4px
        rgba(0,0,0,.55);
    }

    .route-mini-marker.target {
      background: #3aaa35;
    }


    /* =========================================================
       SMALL SCREENS
       ========================================================= */

    @media (max-width: 370px) {

      .route-point-circle {
        width: 92px;
        height: 92px;
      }

      .route-connection {
        margin-left: 6px;
        margin-right: 6px;
      }

      .route-page-actions {
        gap: 8px;
      }

      .route-page-actions button {
        font-size: 15px;
      }
    }

  </style>

</head>

  <!-- =========================================================

  <script type="module">

    import {
      registerPlugin
    } from "./capacitor-core.js";


    /* =========================================================
       ELEMENTE
       ========================================================= */

    const cockpitScreen =
      document.getElementById(
        "cockpitScreen"
      );

    const routeScreen =
      document.getElementById(
        "routeScreen"
      );

    const btnNewRoute =
      document.getElementById(
        "btnNewRoute"
      );

    const btnView =
      document.getElementById(
        "btnView"
      );

    const btnToggle =
      document.getElementById(
        "btnToggle"
      );

    const routeInputPanel =
      document.getElementById(
        "routeInputPanel"
      );

    const routeInputTitle =
      document.getElementById(
        "routeInputTitle"
      );

    const routeInput =
      document.getElementById(
        "routeInput"
      );

    const routeCandidates =
      document.getElementById(
        "routeCandidates"
      );

    const btnRouteSearch =
      document.getElementById(
        "btnRouteSearch"
      );

    const routeSearchCountElement =
      document.getElementById(
        "routeSearchCount"
      );


    /* =========================================================
       ZUSTAND
       ========================================================= */

    let activeRoutePoint = null;

    let routeSearchCount = 0;

    let routeAvailable = false;

    let operatingStatus = "Break";

    let mapView = "Zoom";

    let selectedStart = null;

    let selectedTarget = null;


    /* =========================================================
       HAUPTKARTE
       ========================================================= */

    const map =
      L.map(
        "map",
        {
          zoomControl: false
        }
      ).setView(
        [20, 0],
        2
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);


    window.addEventListener(
      "load",
      () =>
        setTimeout(
          () =>
            map.invalidateSize(true),
          100
        )
    );


    let gpsMarker = null;

    let lastGpsData = null;

    let mapCenteredOnGps = false;

    let testRouteLine = null;


    const gpsDotIcon =
      L.divIcon({
        className: "gps-dot",
        html: "<div></div>",
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });


    const gpsArrowIcon =
      L.divIcon({
        className: "gps-arrow",
        html: "<div></div>",
        iconSize: [20, 30],
        iconAnchor: [10, 15]
      });


    /* =========================================================
       MINI-KARTEN
       ========================================================= */

    let startMiniMap = null;

    let targetMiniMap = null;


    function createMiniMap(
      elementId
    ) {

      const miniMap =
        L.map(
          elementId,
          {
            zoomControl: false,
            attributionControl: false,

            dragging: false,
            touchZoom: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: false
          }
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "© OSM"
        }
      ).addTo(miniMap);


      return miniMap;
    }


    function showMiniMap(
      point,
      position,
      name
    ) {

      const circle =
        document.getElementById(
          point === "start"
            ? "routeStartCircle"
            : "routeTargetCircle"
        );


      const nameElement =
        document.getElementById(
          point === "start"
            ? "routeStartName"
            : "routeTargetName"
        );


      let miniMap;


      if (point === "start") {

        if (!startMiniMap) {

          startMiniMap =
            createMiniMap(
              "routeStartMiniMap"
            );

        }

        miniMap = startMiniMap;

      } else {

        if (!targetMiniMap) {

          targetMiniMap =
            createMiniMap(
              "routeTargetMiniMap"
            );

        }

        miniMap = targetMiniMap;

      }


      nameElement.textContent =
        name;


      circle.classList.add(
        "has-location"
      );


      miniMap.invalidateSize(
        true
      );


      miniMap.setView(
        position,
        15,
        {
          animate: false
        }
      );


      /*
         Alte Marker entfernen.
      */

      miniMap.eachLayer(
        layer => {

          if (
            layer instanceof L.Marker
          ) {

            miniMap.removeLayer(
              layer
            );

          }

        }
      );


      const markerIcon =
        L.divIcon({
          className: "",

          html:
            `<div class="route-mini-marker ${point === "target" ? "target" : ""}"></div>`,

          iconSize: [14, 14],

          iconAnchor: [7, 7]
        });


      L.marker(
        position,
        {
          icon: markerIcon
        }
      ).addTo(
        miniMap
      );


      setTimeout(
        () =>
          miniMap.invalidateSize(
            true
          ),
        100
      );
    }


    /* =========================================================
       ROUTE SCREEN
       ========================================================= */

    function showRoutePage() {

      cockpitScreen.classList.remove(
        "is-active"
      );

      routeScreen.classList.add(
        "is-active"
      );

    }


    function closeRoutePage() {

      routeInput.blur();


      routeInputPanel.classList.remove(
        "is-open"
      );


      routeCandidates.classList.remove(
        "is-visible"
      );


      routeScreen.classList.remove(
        "is-active"
      );


      cockpitScreen.classList.add(
        "is-active"
      );


      requestAnimationFrame(
        () =>
          map.invalidateSize(
            true
          )
      );
    }


    /* =========================================================
       START / ZIEL
       ========================================================= */

    function openPoint(
      point
    ) {

      activeRoutePoint = point;


      routeInputTitle.textContent =
        point === "start"
          ? "START suchen"
          : "ZIEL suchen";


      routeInput.value = "";


      routeInputPanel.classList.add(
        "is-open"
      );


      routeCandidates.classList.remove(
        "is-visible"
      );


      routeInput.scrollIntoView({
        block: "center",
        behavior: "smooth"
      });


      routeInput.focus({
        preventScroll: true
      });

    }


    document
      .getElementById(
        "routeStartCircle"
      )
      .addEventListener(
        "click",
        () =>
          openPoint("start")
      );


    document
      .getElementById(
        "routeTargetCircle"
      )
      .addEventListener(
        "click",
        () =>
          openPoint("target")
      );


    /* =========================================================
       NEW ROUTE
       ========================================================= */

    btnNewRoute.addEventListener(
      "click",
      () =>
        routeAvailable
          ? stopRoute()
          : showRoutePage()
    );


    /* =========================================================
       CANCEL
       ========================================================= */

    document
      .getElementById(
        "btnRouteCancel"
      )
      .addEventListener(
        "click",
        closeRoutePage
      );


    /* =========================================================
       ROUTENLISTE
       ========================================================= */

    document
      .getElementById(
        "btnRouteList"
      )
      .addEventListener(
        "click",
        () => {

          routeInputPanel.classList.remove(
            "is-open"
          );

          routeCandidates.classList.remove(
            "is-visible"
          );

          routeInput.blur();

        }
      );


    /* =========================================================
       SUCHZÄHLER
       ========================================================= */

    function getTodayKey() {

      return new Date()
        .toISOString()
        .slice(0, 10);

    }


    function loadSearchCount() {

      const saved =
        localStorage.getItem(
          "bikehello_route_search_count"
        );


      routeSearchCount =
        localStorage.getItem(
          "bikehello_route_search_date"
        ) === getTodayKey()
          ? Number(saved) || 0
          : 0;


      localStorage.setItem(
        "bikehello_route_search_date",
        getTodayKey()
      );


      localStorage.setItem(
        "bikehello_route_search_count",
        String(routeSearchCount)
      );


      routeSearchCountElement.textContent =
        `(${routeSearchCount + 1})`;

    }


    loadSearchCount();


    /* =========================================================
       INPUT
       ========================================================= */

    routeInput.addEventListener(
      "input",
      () => {

        btnRouteSearch.classList.toggle(
          "is-visible",
          routeInput.value.trim().length > 3
        );

      }
    );


    /* =========================================================
       TESTKANDIDATEN
       ========================================================= */

    const candidates = [

      [
        "Luisenplatz",
        "Luisenplatz 5, 64283 Darmstadt",
        49.8721,
        8.6512
      ],

      [
        "Darmstadt Hbf",
        "Am Hauptbahnhof, 64293 Darmstadt",
        49.8728,
        8.6298
      ],

      [
        "Mathildenhöhe",
        "Olbrichweg 15, 64287 Darmstadt",
        49.8755,
        8.6684
      ],

      [
        "Stadion am Böllenfalltor",
        "Nieder-Ramstädter-Straße 170, 64285 Darmstadt",
        49.8510,
        8.6760
      ],

      [
        "Ludwigsturm",
        "Auf der Ludwigshöhe, 64285 Darmstadt",
        49.8405,
        8.6660
      ]

    ];


    /* =========================================================
       SUCHE
       ========================================================= */

    btnRouteSearch.addEventListener(
      "click",
      () => {

        routeSearchCount++;


        localStorage.setItem(
          "bikehello_route_search_count",
          String(routeSearchCount)
        );


        routeSearchCountElement.textContent =
          `(${routeSearchCount + 1})`;


        routeCandidates.innerHTML =
          candidates
            .map(
              ([name, address]) => `

                <button
                  class="route-candidate"
                  type="button"
                  data-name="${name}"
                >

                  <span
                    class="route-candidate-name"
                  >
                    ${name}
                  </span>

                  <span
                    class="route-candidate-address"
                  >
                    ${address}
                  </span>

                </button>

              `
            )
            .join("");


        routeCandidates.classList.add(
          "is-visible"
        );


        btnRouteSearch.classList.remove(
          "is-visible"
        );


        document
          .querySelectorAll(
            ".route-candidate"
          )
          .forEach(
            button => {

              button.addEventListener(
                "click",
                () => {

                  const selected =
                    candidates.find(
                      candidate =>
                        candidate[0] ===
                        button.dataset.name
                    );


                  if (!selected) {
                    return;
                  }


                  const [
                    name,
                    address,
                    lat,
                    lon
                  ] = selected;


                  const position = [
                    lat,
                    lon
                  ];


                  if (
                    activeRoutePoint ===
                    "start"
                  ) {

                    selectedStart = {
                      name,
                      address,
                      lat,
                      lon
                    };

                  } else {

                    selectedTarget = {
                      name,
                      address,
                      lat,
                      lon
                    };

                  }


                  /*
                     Kandidat wurde ausgewählt:

                     1. Kreis bekommt Mini-Karte
                     2. Punkt wird gesetzt
                     3. Name erscheint im Kreis
                     4. Kandidatenliste verschwindet
                     5. Input verschwindet

                     Dadurch gewinnen wir sofort
                     wieder Platz.
                  */

                  showMiniMap(
                    activeRoutePoint,
                    position,
                    name
                  );


                  routeInputPanel.classList.remove(
                    "is-open"
                  );


                  routeCandidates.classList.remove(
                    "is-visible"
                  );


                  routeInput.blur();

                }
              );

            }
          );

      }
    );


    /* =========================================================
       MAP DISPLAY
       ========================================================= */

    function updateMapDisplay() {

      if (!lastGpsData) {
        return;
      }


      const position = [
        lastGpsData.lat,
        lastGpsData.lon
      ];


      if (!routeAvailable) {

        if (gpsMarker) {
          gpsMarker.setIcon(
            gpsDotIcon
          );
        }


        map.setView(
          position,
          mapView === "Wide"
            ? 12
            : 17,
          {
            animate: false
          }
        );


        return;
      }


      if (
        mapView === "Wide" &&
        testRouteLine
      ) {

        map.fitBounds(
          testRouteLine.getBounds(),
          {
            animate: false,
            padding: [20, 20]
          }
        );

      } else {

        map.setView(
          position,
          17,
          {
            animate: false
          }
        );

      }

    }


    /* =========================================================
       UI
       ========================================================= */

    function updateUI() {

      updateMapDisplay();


      btnNewRoute.textContent =
        routeAvailable
          ? "Stop"
          : "New";


      btnToggle.classList.toggle(
        "disabled",
        !routeAvailable
      );


      btnToggle.classList.toggle(
        "status-active",
        routeAvailable
      );


      document.getElementById(
        "iconGo"
      ).hidden =
        operatingStatus !== "Ride" ||
        !routeAvailable;


      document.getElementById(
        "iconBreak"
      ).hidden =
        operatingStatus === "Ride" &&
        routeAvailable;


      btnView.textContent =
        mapView;


      if (!routeAvailable) {

        document.getElementById(
          "vDistLeft"
        ).textContent =
          "0.0";


        document.getElementById(
          "vDistTotal"
        ).textContent =
          "(0.0)";


        document.getElementById(
          "vTimeLeft"
        ).textContent =
          "0:00";


        document.getElementById(
          "vTimeTotal"
        ).textContent =
          "(0:00)";
      }

    }


    /* =========================================================
       STOP
       ========================================================= */

    function stopRoute() {

      if (testRouteLine) {

        map.removeLayer(
          testRouteLine
        );

        testRouteLine = null;

      }


      routeAvailable = false;

      operatingStatus = "Break";


      updateUI();

    }


    /* =========================================================
       STATUS
       ========================================================= */

    btnToggle.addEventListener(
      "click",
      () => {

        if (!routeAvailable) {
          return;
        }


        operatingStatus =
          operatingStatus === "Break"
            ? "Ride"
            : "Break";


        updateUI();

      }
    );


    /* =========================================================
       MAP VIEW
       ========================================================= */

    btnView.addEventListener(
      "click",
      () => {

        mapView =
          mapView === "Zoom"
            ? "Wide"
            : "Zoom";


        updateUI();

      }
    );


    updateUI();


    /* =========================================================
       GPS
       ========================================================= */

    try {

      const GPS =
        registerPlugin("GPS");


      GPS.addListener(
        "gpsData",
        data => {

          document.getElementById(
            "vSpeed"
          ).textContent =
            `${(data.speed * 3.6).toFixed(1)} km/h`;


          document.getElementById(
            "vAltitude"
          ).textContent =
            `${data.altitude.toFixed(0)} m`;


          const position = [
            data.lat,
            data.lon
          ];


          const speedKmh =
            (Number(data.speed) || 0) *
            3.6;


          if (!gpsMarker) {

            gpsMarker =
              L.marker(
                position,
                {
                  icon: gpsDotIcon,
                  zIndexOffset: 1000
                }
              ).addTo(map);

          } else {

            gpsMarker.setLatLng(
              position
            );


            gpsMarker.setIcon(
              speedKmh >= 1
                ? gpsArrowIcon
                : gpsDotIcon
            );

          }


          if (
            data.courseValid &&
            gpsMarker
          ) {

            const arrow =
              gpsMarker
                .getElement()
                ?.querySelector("div");


            if (arrow) {

              arrow.style.transform =
                `rotate(${data.course}deg)`;

            }

          }


          if (!mapCenteredOnGps) {

            mapCenteredOnGps = true;


            setTimeout(
              () =>
                map.setView(
                  position,
                  17
                ),
              1000
            );

          }


          lastGpsData = data;

        }
      );


      setTimeout(
        () =>
          GPS.start().catch(
            () => {}
          ),
        500
      );

    } catch (_) {

      /* Browser-Vorschau ohne Capacitor */

    }

  </script>

</body>
</html>
