<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bike Navigation</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: white;
    box-sizing: border-box;
}

*, *::before, *::after {
    box-sizing: border-box;
}


/* =====================================================
   APP-BEREICH
===================================================== */

#app {
    width: 100%;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}


/* =====================================================
   OBERER BEREICH
===================================================== */

#container {
    display: flex;
    width: 100%;
    height: 50vh;
    padding: 10px;
    gap: 10px;
    flex-shrink: 0;
}

#mapWrapper {
    flex: 1;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
    border-radius: 8px;
}

#buttonColumn {
    width: 70px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.button {
    width: 70px;
    height: 50px;
    border-radius: 12px;
    background: #C3E2C8;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.button.disabled {
    opacity: 0.35;
    filter: grayscale(100%);
    cursor: default;
    pointer-events: none;
}
/* =====================================================
   AKTIVER STATUS-BUTTON
===================================================== */

.button.status-active {
    border: 3px solid #555;
}

/* =====================================================
   TIME / DISTANCE BEI BREAK
===================================================== */

.data-paused {
    color: #999 !important;
}
.status-box {
    width: 70px;
    height: 62px;
    border-radius: 12px;
    background: #F5F5F5;
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.status-label {
    font-size: 8px;
    font-weight: bold;
    margin-bottom: 2px;
}

.status-icon {
    font-size: 27px;
    line-height: 27px;
}

.status-box.not-started {
    background: #FFD6D6;
}

.status-box.active {
    background: #C3E2C8;
}

.status-box.paused {
    background: #FFF0B3;
}

.button.route {
    font-size: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.marker-icon {
    width: 18px;
    height: auto;
}

.route-line {
    font-size: 40px;
    font-weight: 300;
    opacity: 0.8;
}

.nav-icon {
    font-size: 42px;
}

.btn-txt {
    font-size: 21px;
    font-weight: bold;
}

.btn-view {
    margin-top: 10px;
}


/* =====================================================
   UNTERER BEREICH
===================================================== */

#bottomPanel {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    padding: 20px;
    gap: 20px;
    background: rgba(255,255,255,0.9);
    overflow: hidden;
}

#vitaldaten {
    width: 55%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}

#sensorBottom {
    width: 42%;
    margin-left: 3%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow: hidden;
}


/* =====================================================
   WERTE
===================================================== */

.vital-item,
.sensor-item {
    display: flex;
    flex-direction: column;
}

.vital-label,
.sensor-label {
    font-size: 14px;
    color: #666;
    font-weight: 300;
}

.vital-value,
.sensor-value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 3px;
}

.secondary-value {
    font-size: 18px;
    color: #888;
    font-weight: 400;
    margin-left: 6px;
}


/* =====================================================
   ROUTE-HINWEIS
===================================================== */

#routeHint {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    z-index: 9999;
}

/* =====================================================
   GPS-MARKER
===================================================== */

.gps-dot {
    background: transparent;
    border: none;
}

.gps-dot div {
    width: 18px;
    height: 18px;
    background: #2E7D32;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      transform-origin: center center;
}

.gps-arrow {
    background: transparent;
    border: none;
}

.gps-arrow div {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 26px solid #2E7D32;
      filter: drop-shadow(0 1px 2px white);
  }


/* =====================================================
   NEUES BIKEHELLO COCKPIT
===================================================== */

/* Hauptbereich */
#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Karte volle Breite */
#mapWrapper {
    width: 100%;
    flex: 1;
    min-height: 0;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
}

/* Datenbereich */
#bottomPanel {
    width: 100%;
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 12px 18px;
    gap: 24px;
    background: rgba(255,255,255,0.95);
    overflow: hidden;
    box-sizing: border-box;
}

/* Linke und rechte Datenspalte */
#vitaldaten,
#sensorBottom {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Einzelne Werte */
.vital-item,
.sensor-item {
    display: flex;
    flex-direction: column;
}

.vital-label,
.sensor-label {
    font-size: 13px;
    color: #666;
    font-weight: 400;
}

.vital-value,
.sensor-value {
    font-size: 24px;
    font-weight: 600;
    margin-top: 1px;
}

.secondary-value {
    font-size: 16px;
    color: #888;
    font-weight: 400;
    margin-left: 5px;
}

/* =====================================================
   BEDIENLEISTE
===================================================== */

#controlBar {
    width: 100%;
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom)) 12px;
    background: rgba(255,255,255,0.98);
    box-sizing: border-box;
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.control-label {
    font-size: 12px;
    font-weight: 600;
    color: #666;
    letter-spacing: 0.5px;
}

.control-group .button {
    width: 100%;
    height: 52px;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    border-radius: 9px;
}

.control-group .btn-txt {
    font-size: 18px;
    font-weight: bold;
}

/* STATUS: optisch Statusanzeige, technisch weiterhin klickbar */
#btnToggle {
    border-radius: 9px;
    background: rgba(245,245,245,0.95);
    border: 1px solid #d0d0d0;
}

#btnToggle.status-active {
    border: 3px solid #555;
}

/* ROUTE und MAP: klar erkennbare Aktionsflächen */
#btnNewRoute,
#btnView {
    border-radius: 9px;
}

/* STATUS: Fahrrad als zentrale Statusanzeige */
.status-display {
    min-height: 52px;
    height: 52px;
    border-radius: 9px;
    border: 1px solid #d0d0d0;
    background: rgba(245,245,245,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

.status-bike {
    font-size: 38px;
    line-height: 1;
}

/* Alte rechte Button-Spalte nicht mehr verwenden */
#buttonColumn {
    display: none;
}

/* Alte Container-Struktur neutralisieren */
#container {
    width: 100%;
    flex: 1;
    min-height: 0;
    display: block;
}

/* Alte VIEW-Abstände entfernen */
.btn-view {
    margin-top: 0;
}


/* =====================================================
   ROUTING OVERLAY - PROTOTYP
===================================================== */

#routeOverlay {
    position: absolute;
    inset: 0;
    z-index: 1000;
    display: none;
    background: rgba(255,255,255,0.18);
    box-sizing: border-box;
}

#routeOverlayContent {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.route-definition {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.route-point {
    width: 105px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.route-point-circle {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 2px solid rgba(80,80,80,0.55);
    background: rgba(255,255,255,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    font-size: 30px;
}

.route-point-label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    letter-spacing: 0.4px;
}

.route-edit {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #bbb;
    background: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-sizing: border-box;
}

.route-arrow {
    font-size: 30px;
    color: #666;
    margin-top: -20px;
}

#btnRouteList {
    margin-top: 34px;
    min-width: 150px;
    height: 44px;
    border-radius: 9px;
    border: 1px solid #bbb;
    background: rgba(255,255,255,0.92);
    font-size: 16px;
    font-weight: 600;
}

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>


<body>

<div id="app">

    <!-- =================================================
         KARTE
    ================================================= -->

    <div id="mapWrapper">
        <div id="map"></div>

        <div id="routeOverlay">
            <div id="routeOverlayContent">

                <div class="route-definition">

                    <div class="route-point">
                        <div class="route-point-circle">?</div>
                        <div class="route-point-label">START</div>
                        <div class="route-edit">&#x270F;</div>
                    </div>

                    <div class="route-arrow">&#x2192;</div>

                    <div class="route-point">
                        <div class="route-point-circle">?</div>
                        <div class="route-point-label">ZIEL</div>
                        <div class="route-edit">&#x270F;</div>
                    </div>

                </div>

                <button id="btnRouteList">ROUTENLISTE</button>

            </div>
        </div>
    </div>


    <!-- =================================================
         DATEN
    ================================================= -->

    <div id="bottomPanel">

        <!-- FAHRDATEN -->

        <div id="vitaldaten">

            <div class="vital-item">
                <span class="vital-label">Speed</span>
                <span class="vital-value" id="vSpeed">22.5 km/h</span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Altitude</span>
                <span class="vital-value" id="vAltitude">236 m</span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Distance</span>
                <span class="vital-value">
                    <span id="vDistLeft">38.8</span>
                    <span class="secondary-value" id="vDistTotal">(52.3)</span>
                </span>
            </div>

            <div class="vital-item">
                <span class="vital-label">Time</span>
                <span class="vital-value">
                    <span id="vTimeLeft">3:50</span>
                    <span class="secondary-value" id="vTimeTotal">(5:12)</span>
                </span>
            </div>

        </div>


        <!-- E-BIKE-DATEN -->

        <div id="sensorBottom">

            <div class="sensor-item">
                <span class="sensor-label">Power</span>
                <span class="sensor-value" id="vPower">245 W</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Battery</span>
                <span class="sensor-value" id="vBattery">67 %</span>
            </div>

            <div class="sensor-item">
                <span class="sensor-label">Range</span>
                <span class="sensor-value" id="vRange">54 km</span>
            </div>

        </div>

    </div>


    <!-- =================================================
         BEDIENLEISTE
    ================================================= -->

    <div id="controlBar">

        <!-- ROUTE -->

        <div class="control-group">

            <div class="control-label">ROUTE</div>

            <div id="btnNewRoute" class="button route">
                <span class="btn-txt">New</span>
            </div>

        </div>


        <!-- STATUS -->

        <div class="control-group">

            <div class="control-label">STATUS</div>

            <div id="btnToggle" class="button">
                <span id="iconGo" class="status-bike">&#x1F6B4;</span>
                <span id="iconBreak" class="status-bike" style="display:none;">&#x1F6B2;</span>
            </div>

        </div>


        <!-- KARTE -->

        <div class="control-group">

            <div class="control-label">MAP</div>

            <div id="btnView" class="button btn-view">
                <span class="btn-txt">Zoom</span>
            </div>

        </div>

    </div>

</div>
<script type="module">
/* =====================================================
   CAPACITOR / GPS
===================================================== */

import { registerPlugin } from "./capacitor-core.js";

const GPS = registerPlugin("GPS");
let gpsActive = false;


/* =====================================================
   LEAFLET KARTE
===================================================== */

const map = L.map("map", {
    zoomControl: false
}).setView([20, 0], 2);

const testDestination = [49.8727, 8.6512];
let testRouteLine = null;
let routeActive = false;

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "  OpenStreetMap"
    }
).addTo(map);

window.addEventListener("load", () => {
    map.invalidateSize(true);

    setTimeout(() => {
        map.invalidateSize(true);
    }, 500);

    setTimeout(() => {
        map.invalidateSize(true);
    }, 1000);
});


/* =====================================================
   GPS-POSITION AUF DER KARTE
===================================================== */

let gpsMarker = null;
let lastGpsData = null;
let mapCenteredOnGps = false;


/* Punkt fuer stehendes Fahrrad */
const gpsDotIcon = L.divIcon({
    className: "gps-dot",
    html: '<div></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 9]
});


/* Pfeil fuer fahrendes Fahrrad */
const gpsArrowIcon = L.divIcon({
    className: 'gps-arrow',
    html: '<div></div>',
    iconSize: [20, 30],
    iconAnchor: [10, 15]
});


/* =====================================================
   WERTE
===================================================== */

const vSpeed = document.getElementById("vSpeed");
const vAltitude = document.getElementById("vAltitude");


/* =====================================================
   GPS-DATEN
===================================================== */

GPS.addListener("gpsDebug", (data) => {
    console.log(data.message);
});

GPS.addListener("gpsData", (data) => {

    /* =================================================
       SPEED + ALTITUDE
    ================================================= */

    vSpeed.textContent =
        (data.speed * 3.6).toFixed(1);

    vAltitude.textContent =
        data.altitude.toFixed(0);


    /* =================================================
       GPS-POSITION AUF DER KARTE
    ================================================= */

    const position = [
        data.lat,
        data.lon
    ];

    const courseValid = data.courseValid === true;

    /* =================================================
       GPS-MARKER: PUNKT / PFEIL AB 1 km/h
    ================================================= */

    const speedMs = Number(data.speed) || 0;
    const speedKmh = speedMs * 3.6;

    if (gpsMarker) {
        if (speedKmh >= 1.0) {
            gpsMarker.setIcon(gpsArrowIcon);
        } else {
            gpsMarker.setIcon(gpsDotIcon);
        }

        if (courseValid) {
            const markerElement = gpsMarker.getElement();
            const iconElement = markerElement
                ? markerElement.querySelector("div")
                : null;

            if (iconElement) {
                iconElement.style.transform =
                    `rotate(${data.course}deg)`;
            }
        }
    }


    /* =================================================
       MARKER ERSTELLEN
    ================================================= */

    if (!gpsMarker) {

    gpsMarker = L.marker(position, {
        icon: gpsDotIcon,
        zIndexOffset: 1000
    }).addTo(map);

} else {

    gpsMarker.setLatLng(position);
}

if (!mapCenteredOnGps) {
    mapCenteredOnGps = true;

    setTimeout(() => {
        map.setView(position, 17);
    }, 1000);
}


    /* Letzte GPS-Daten merken */
    lastGpsData = data;


    console.log(
        "GPS:",
        data.lat,
        data.lon,
        "Speed:",
        data.speed,
        "Course:",
        data.course,
        "valid:",
        data.courseValid,
        "Altitude:",
        data.altitude
    );
});

/* =====================================================
   BUTTONS
===================================================== */

const btnToggle = document.getElementById("btnToggle");
const btnView = document.getElementById("btnView");
const btnNewRoute = document.getElementById("btnNewRoute");
const routeOverlay = document.getElementById("routeOverlay");

btnView.classList.remove("disabled");

const go = document.getElementById("iconGo");
const br = document.getElementById("iconBreak");

/* =====================================================
   BIKEHELLO ZUSTAND
===================================================== */

let operatingStatus = "Break";      // Break / Ride
let mapView = "Zoom";               // Zoom / Wide
let routeAvailable = false;         // true / false


/* =====================================================
   ZUSTAND -> BUTTON-ANZEIGE
===================================================== */

function updateMapDisplay() {

    /* =================================================
       KEINE ROUTE VORHANDEN
       GPS = Standort zoom
       Route = Standort weit
    ================================================= */

    if (!routeAvailable) {

        if (!lastGpsData) {
            return;
        }

        const position = [
            lastGpsData.lat,
            lastGpsData.lon
        ];

        if (gpsMarker) {
            gpsMarker.setIcon(gpsDotIcon);
        }

        if (mapView === "Wide") {

            /* Standort weit */
            map.setView(position, 12, {
                animate: false
            });

            console.log("Karte: Standort weit");

        } else {

            /* Standort zoom */
            map.setView(position, 17, {
                animate: false
            });

            console.log("Karte: Standort zoom");
        }

        return;
    }

    /* =================================================
       ROUTE VORHANDEN
    ================================================= */

    if (mapView === "Wide") {

        /* Wide = komplette Route */
        if (testRouteLine) {
            map.fitBounds(testRouteLine.getBounds(), {
                animate: false,
                padding: [20, 20]
            });

            console.log("Karte: komplette Route");
        }

    } else {

        /* Zoom = aktueller Standort */
        if (lastGpsData) {
            const position = [
                lastGpsData.lat,
                lastGpsData.lon
            ];

            map.setView(position, 17, {
                animate: false
            });

            console.log("Karte: Route-Zoom");
        }
    }
    }
function updateUI() {

    updateMapDisplay();

    /* =================================================
       ROUTE
       Empty = keine Route
       Ready = Route vorhanden
    ================================================= */

    if (routeAvailable) {

        btnNewRoute.querySelector(".btn-txt").textContent = "Stop";
        btnToggle.classList.remove("disabled");
        btnToggle.classList.add("status-active");

    } else {

        btnNewRoute.querySelector(".btn-txt").textContent = "New";
        btnToggle.classList.add("disabled");
        btnToggle.classList.remove("status-active");

        /* Empty = Time und Distance auf 0 */
        document.getElementById("vDistLeft").textContent = "0.0";
        document.getElementById("vDistTotal").textContent = "(0.0)";
        document.getElementById("vTimeLeft").textContent = "0:00";
        document.getElementById("vTimeTotal").textContent = "(0:00)";
    }


    /* =================================================
       STATUS
       Break = Fahrrad ohne Fahrer
       Ride  = Fahrrad mit Fahrer
    ================================================= */

    const pausedFields = [
        document.getElementById("vDistLeft"),
        document.getElementById("vDistTotal"),
        document.getElementById("vTimeLeft"),
        document.getElementById("vTimeTotal")
    ];

    if (operatingStatus === "Ride" && routeAvailable) {

        go.style.display = "inline";
        br.style.display = "none";

        pausedFields.forEach(el => {
            if (el) el.classList.remove("data-paused");
        });

    } else {

        go.style.display = "none";
        br.style.display = "inline";

        pausedFields.forEach(el => {
            if (el) el.classList.add("data-paused");
        });
    }


    /* =================================================
       MAP
    ================================================= */

    btnView.classList.remove("disabled");

    if (mapView === "Zoom") {
        btnView.querySelector(".btn-txt").textContent = "Zoom";
    } else {
        btnView.querySelector(".btn-txt").textContent = "Wide";
    }
}
/* =====================================================
   MAP BUTTON
===================================================== */

updateUI();

btnView.addEventListener("click", () => {

    if (mapView === "Zoom") {
        mapView = "Wide";
        console.log("VIEW: Standort weit");
    } else {
        mapView = "Zoom";
        console.log("VIEW: Standort zoom");
    }

    updateUI();

});


/* =====================================================
   STATUS BUTTON
===================================================== */

btnToggle.addEventListener("click", () => {

    /* Status ist nur bei vorhandener Route aktiv */
    if (!routeAvailable) {
        console.log("STATUS: inaktiv - keine Route");
        return;
    }

    /* Break <-> Ride */
    if (operatingStatus === "Break") {
        operatingStatus = "Ride";
        console.log("STATUS: BREAK -> RIDE");
    } else {
        operatingStatus = "Break";
        console.log("STATUS: RIDE -> BREAK");
    }

    updateUI();
});

btnNewRoute.addEventListener("click", () => {

    /* =================================================
       READY -> EMPTY
       Route entfernen
    ================================================= */

    if (routeAvailable) {

        if (testRouteLine) {
            map.removeLayer(testRouteLine);
            testRouteLine = null;
        }

        routeActive = false;
        routeAvailable = false;

        operatingStatus = "Break";

        console.log("ROUTE: Ready -> Empty");

        updateUI();
        return;
    }


    /* =================================================
       EMPTY -> ROUTING
       Routing-Overlay öffnen
    ================================================= */

    routeOverlay.style.display = "block";

    console.log("ROUTE: Empty -> Routing");

});

/* =====================================================
   EXIT
===================================================== */

/* =====================================================
   GPS BEIM APP-START
===================================================== */
setTimeout(async () => {

    try {

        await GPS.start(); gpsActive = true;
