<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BikeHello</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }


    /* =========================================================
       SCREENS
       ========================================================= */

    .screen {
      display: none;
      width: 100%;
      height: 100dvh;
      min-height: 0;
    }

    .screen.is-active {
      display: flex;
    }


    /* =========================================================
       COCKPIT
       ========================================================= */

    #cockpitScreen {
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }

    #mapWrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 10px;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    #bottomPanel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 12px 18px;
      background: rgba(255,255,255,.96);
    }

    #vitaldaten,
    #sensorBottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vital-item,
    .sensor-item {
      display: flex;
      flex-direction: column;
    }

    .vital-label,
    .sensor-label {
      color: #666;
      font-size: 13px;
    }

    .vital-value,
    .sensor-value {
      margin-top: 1px;
      font-size: 24px;
      font-weight: 600;
    }

    .secondary-value {
      margin-left: 5px;
      color: #888;
      font-size: 16px;
      font-weight: 400;
    }

    .data-paused {
      color: #999 !important;
    }

    #controlBar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.98);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .button {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 9px;
      background: #c3e2c8;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
    }

    .button.disabled {
      opacity: .35;
      filter: grayscale(1);
      pointer-events: none;
    }

    #btnToggle {
      background: #f5f5f5;
    }

    #btnToggle.status-active {
      border: 3px solid #555;
    }

    .status-bike {
      font-size: 38px;
      line-height: 1;
    }

    .gps-dot,
    .gps-arrow {
      background: transparent;
      border: 0;
    }

    .gps-dot div {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #2e7d32;
      box-shadow: 0 1px 4px rgba(0,0,0,.5);
      transform-origin: center;
    }

    .gps-arrow div {
      width: 0;
      height: 0;
      border-right: 10px solid transparent;
      border-bottom: 26px solid #2e7d32;
      border-left: 10px solid transparent;
      filter: drop-shadow(0 1px 2px #fff);
      transform-origin: center;
    }

    .route-cockpit-marker {
      position: relative;
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
    }

    .route-cockpit-marker::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 6.5px;
      top: 6.5px;
      background: #fff;
      border-radius: 50%;
    }

    .route-cockpit-marker.start {
      background: #d9534f;
    }

    .route-cockpit-marker.target {
      background: #3aaa35;
    }

    /* Marker in den großen START-/ZIEL-Kreisen */
    .route-point-circle .route-cockpit-marker {
      width: 30px;
      height: 30px;
    }

    .route-point-circle .route-cockpit-marker::after {
      width: 8px;
      height: 8px;
      left: 8px;
      top: 8px;
    }


    /* =========================================================
       ROUTE SCREEN
       ========================================================= */

    #routeScreen {
      flex-direction: column;
      min-height: 0;
      overflow: hidden;

      background: #f8faf8;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .route-page-header {
      flex: none;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;
    }

    .route-page-title {
      margin: -10px;

      color: #444;

      font-size: 22px;
      font-weight: 600;
    }


    /* =========================================================
       BODY
       ========================================================= */

    .route-page-body {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 4px 0 0;
    }


    /* =========================================================
       START / ZIEL
       ========================================================= */

    .route-definition {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      width: 100%;
      max-width: 600px;

      margin: 0 auto 24px;
    }

    .route-point {
      display: flex;
      flex: none;

      flex-direction: column;
      align-items: center;

      width: clamp(145px, 39vw, 165px);
    }


    .route-point-circle {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: clamp(145px, 39vw, 165px);
      height: clamp(145px, 39vw, 165px);

      padding: 0;

      overflow: hidden;

      border: 2px solid rgba(80,80,80,.55);
      border-radius: 50%;

      background: rgba(255,255,255,.92);

      color: #555;

      cursor: pointer;
    }

    .route-point-circle:focus-visible {
      outline: 3px solid #2f6fed;
      outline-offset: 3px;
    }


    /* =========================================================
       MINI MAP
       ========================================================= */

    .route-mini-map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }

    .route-point-circle.has-location
    .route-mini-map {
      opacity: 1;
    }


    /* =========================================================
       CIRCLE CONTENT
       ========================================================= */

    .route-circle-content {
      position: relative;
      z-index: 10;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding: 12px;

      border-radius: 50%;

      background: rgba(255,255,255,.88);
    }

    .route-point-circle.has-location
    .route-circle-content {
      background: rgba(255,255,255,.20);
    }


    /* =========================================================
       START / TARGET MARKER
       ========================================================= */

    .route-marker {
      width: 25px;
      height: 25px;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);
    }

    .start-marker {
      background: #d9534f;
    }

    .target-marker {
      background: #3aaa35;
    }


    /* =========================================================
       TEXT IN CIRCLE
       ========================================================= */

    .route-point-text {
      margin-top: 8px;

      font-size: 19px;
      font-weight: 700;

      text-align: center;

      text-shadow:
        0 1px 2px rgba(255,255,255,.9);
    }


    /* =========================================================
       NAME / ADDRESS UNDER CIRCLE
       ========================================================= */

    .route-selected-info {
      display: none;

      width: 100%;

      min-height: 38px;

      margin-top: 9px;

      text-align: center;

      line-height: 1.2;

      text-shadow:
        0 1px 2px rgba(255,255,255,.95);
    }

    .route-point.has-location
    .route-selected-info {
      display: block;
    }

    .route-selected-info-name {
      color: #444;

      font-size: 15px;
      font-weight: 700;
    }

    .route-selected-info-address {
      min-height: 15px;

      margin-top: 2px;

      color: #777;

      font-size: 12px;
      font-weight: 400;
    }


    /* =========================================================
       CONNECTION / PFEIL
       ========================================================= */

    .route-connection {
      position: relative;

      flex: 1;

      max-width: 105px;
      min-width: 15px;

      height: 8px;

      margin: 72px 8px 0;

      border-radius: 4px;

      background: #2f6fed;
    }

    .route-connection::after {
      content: "";

      position: absolute;

      right: 0px;
      top: 50%;

      width: 14px;
      height: 14px;

      border-top: 7px solid #2f6fed;
      border-right: 7px solid #2f6fed;

      transform:
        translateY(-50%)
        rotate(45deg);

      border-radius: 1px;
    }


    /* =========================================================
       INPUT PANEL
       ========================================================= */

    .route-input-panel {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding: 14px 14px 15px;

      border:
        1px solid
        rgba(120,120,120,.45);

      border-radius: 12px;

      background:
        rgba(255,255,255,.95);
    }

    .route-input-panel.is-open {
      display: block;
    }

    .route-input-title {
      margin-bottom: 9px;

      color: #666;

      font-size: 17px;
      line-height: 1.2;

      font-weight: 700;
    }

    .route-input-row {
      display: flex;
      align-items: center;

      min-height: 46px;

      border:
        1px solid
        #aaa;

      border-radius: 9px;

      background: #fff;

      padding-left: 12px;
    }

    #routeInput {
      flex: 1;

      min-width: 0;

      height: 44px;

      border: 0;
      outline: 0;

      color: #444;

      background: transparent;

      font-size: 16px;
    }


    /* =========================================================
       SEARCH / MEIN STANDORT BUTTON
       ========================================================= */

    #btnRouteSearch,
    #btnMyLocation {
      display: none;

      flex: none;

      width: 62px;
      height: 38px;

      margin-right: 3px;

      padding: 0;

      border:
        1px solid
        rgba(0,0,0,.18);

      border-radius: 8px;

      background: #f7f7f7;

      color: #444;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }

    #btnMyLocation {
      width: 110px;
    }

    #btnMyLocation.is-visible {
      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    #btnRouteSearch.is-visible {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 2px;

      font-size: 17px;
    }

    #routeSearchCount {
      white-space: nowrap;
      display: inline-block;
    }


    /* =========================================================
       CANDIDATES
       ========================================================= */

    #routeCandidates {
      display: none;

      width: 100%;
      max-width: 600px;

      margin: 18px auto 0;
    }

    #routeCandidates.is-visible {
      display: block;
    }

    .route-candidate {
      display: block;

      width: 100%;

      margin-bottom: 7px;

      padding: 9px 12px;

      border:
        1px solid
        #b8b8b8;

      border-radius: 9px;

      background: #fff;

      box-shadow:
        0 2px 5px rgba(0,0,0,.08);

      cursor: pointer;

      text-align: left;
    }

    .route-candidate-name {
      display: block;

      color: #555;

      font-size: 16px;
      line-height: 1.2;

      font-weight: 700;
    }

    .route-candidate-address {
      display: block;

      margin-top: 3px;

      color: #777;

      font-size: 13px;
      line-height: 1.2;
    }

    .route-candidate:active {
      background: #f0f5ff;
    }


    /* =========================================================
       ROUTE BERECHNEN
       ========================================================= */

    #routeCalculateButton {
      display: none;

      width: 100%;
      max-width: 600px;

      min-height: 52px;

      margin: 18px auto 0;

      border:
        1px solid
        rgba(47,111,237,.45);

      border-radius: 9px;

      background:
        #dce9ff;

      color:
        #2455a7;

      box-shadow:
        0 4px 10px rgba(0,0,0,.18);

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;
    }

    #routeCalculateButton.is-visible {
      display: block;
    }


    /* =========================================================
       BOTTOM BUTTONS
       ========================================================= */

    .route-page-actions {
      flex: none;

      display: flex;

      justify-content: center;

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      gap: 10px;

      padding:
        12px
        0
        7px;

      background: #f8faf8;
    }

    .route-page-actions button {
      flex: 1;

      min-width: 0;

      min-height: 52px;

      border: 1px solid rgba(0,0,0,.25);

      border-radius: 9px;

      box-shadow:
        0 4px 10px rgba(0,0,0,.18);

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;
    }


    /* =========================================================
       ROUTENLISTE
       ========================================================= */

    #btnRouteList {
      border-color:
        rgba(47,111,237,.35);

      background:
        #dce9ff;

      color:
        #2455a7;
    }


    /* =========================================================
       CANCEL
       ========================================================= */

    #btnRouteCancel {
      border-color:
        rgba(170,45,45,.45);

      background:
        #f3b5b5;

      color:
        #8e2020;
    }


    /* =========================================================
       MINI MAP MARKER
       ========================================================= */

    .route-mini-map
    .leaflet-control-attribution {
      font-size: 6px;
      line-height: 8px;

      background:
        rgba(255,255,255,.65);
    }

    .route-mini-marker {
      position: relative;
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
      background: #d9534f;
    }

    .route-mini-marker::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
    }

    .route-mini-marker.start {
      background: #d9534f;
    }

    .route-mini-marker.target {
      background: #3aaa35;
    }


    /* =========================================================
       SMALL SCREENS
       ========================================================= */

    @media (max-width: 370px) {

      .route-point,
      .route-point-circle {
        width: 135px;
      }

      .route-point-circle {
        height: 135px;
      }

      .route-connection {
        max-width: 70px;
        margin-left: 5px;
        margin-right: 5px;
      }

      .route-page-actions button {
        font-size: 16px;
      }

    }

  </style>

</head>

    const btnView =

    const btnToggle =

    const routeInputPanel =

    const routeInputTitle =

    const routeInput =
      document.getElementById("routeInput");

    const routeCandidates =

    const btnRouteSearch =

            attributionControl: false,

            dragging: false,
            touchZoom: false,
            scrollWheelZoom: false,

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19
        }
      ).addTo(miniMap);


      return miniMap;
    }


    function showMiniMap(

        document.getElementById(

      let miniMap;


      if (point === "start") {

        if (!startMiniMap) {
          startMiniMap =
            createMiniMap(
              "routeStartMiniMap"
            );
        }

        miniMap = startMiniMap;

      } else {

        if (!targetMiniMap) {
          targetMiniMap =
            createMiniMap(
              "routeTargetMiniMap"
            );
        }

        miniMap = targetMiniMap;
      }


      circle.classList.add(
        "has-location"
      );


      miniMap.invalidateSize(true);


      miniMap.setView(
        position,
        14,
        {
          animate: false
        }
      );


      miniMap.eachLayer(
        layer => {

          if (
            layer instanceof L.Marker
          ) {
            miniMap.removeLayer(layer);
          }

        }
      );


      const markerIcon =
        L.divIcon({
          className: "",

          html:
            `<div class="route-mini-marker ${point === "target" ? "target" : "start"}"></div>`,

          iconSize: [28,28],

          iconAnchor: [14,14]
        });


      L.marker(
        position,
        {
          icon: markerIcon

      ).addTo(miniMap);


      setTimeout(
        () =>
          miniMap.invalidateSize(true),
        100

    /* =========================================================
       MOCK ROUTENBERECHNUNG
       ========================================================= */

    function calculateMockDistanceKm(
      start,
      target
    ) {

      const R = 6371;


      const lat1 =
        start.lat *
        Math.PI / 180;

      const lat2 =
        target.lat *
        Math.PI / 180;


      const deltaLat =
        (target.lat - start.lat) *
        Math.PI / 180;

      const deltaLon =
        (target.lon - start.lon) *
        Math.PI / 180;


      const a =
        Math.sin(deltaLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(deltaLon / 2) ** 2;


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    function formatMockTime(
      minutes
    ) {

      const totalMinutes =
        Math.max(
          1,
          Math.round(minutes)
        );


      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const remainingMinutes =
        totalMinutes % 60;


      if (hours > 0) {

        return `${hours}:${String(
          remainingMinutes
        ).padStart(2, "0")}`;

      }


      return `0:${String(
        remainingMinutes
      ).padStart(2, "0")}`;

    }


    function calculateMockRoute() {

      if (
        !selectedStart ||
        !selectedTarget
      ) {
        return;
      }


      const startPosition = [
        selectedStart.lat,
        selectedStart.lon
      ];


      const targetPosition = [
        selectedTarget.lat,
        selectedTarget.lon
      ];


      /* ---------------------------------------------------------
         Gerade Linie als Mock-Route
         --------------------------------------------------------- */

      if (testRouteLine) {

        map.removeLayer(
          testRouteLine
        );

       testRouteLine = null;

      }


      testRouteLine =
        L.polyline(
          [
            startPosition,
            targetPosition
          ],
          {
            color: "#2f6fed",
            weight: 6,
            opacity: 0.9
          }
        ).addTo(map);

      /* ---------------------------------------------------------
         Start- und Zielmarker
         --------------------------------------------------------- */

      if (routeStartMarker) {

        map.removeLayer(
          routeStartMarker
        );

        routeStartMarker = null;

      }


      if (routeTargetMarker) {

        map.removeLayer(
          routeTargetMarker
        );

        routeTargetMarker = null;

      }

      routeStartMarker =
        L.marker(
          startPosition,
          {
            icon: routeStartIcon,
            zIndexOffset: 900
          }
        ).addTo(map);


      routeTargetMarker =
        L.marker(
          targetPosition,
          {
            icon: routeTargetIcon,
            zIndexOffset: 900
          }
        ).addTo(map);


      /* ---------------------------------------------------------
         Mock-Distanz und Mock-Fahrzeit
         --------------------------------------------------------- */
 
      const distanceKm =
        calculateMockDistanceKm(
          selectedStart,
          selectedTarget
        );


      /*
         Angenommene Durchschnittsgeschwindigkeit:
         20 km/h
      */

      const timeMinutes =
        distanceKm /
        20 *
        60;


      document.getElementById(
        "vDistLeft"
      ).textContent =
        distanceKm.toFixed(1);


      document.getElementById(
        "vDistTotal"
      ).textContent =
        `(${distanceKm.toFixed(1)})`;


      document.getElementById(
        "vTimeLeft"
      ).textContent =
        formatMockTime(
          timeMinutes
        );


      document.getElementById(
        "vTimeTotal"
      ).textContent =
        `(${formatMockTime(
          timeMinutes
        )})`;


      /* ---------------------------------------------------------
         Request zählen
         --------------------------------------------------------- */

      increaseRequestCount();


      /* ---------------------------------------------------------
         Route aktivieren
         --------------------------------------------------------- */

      routeAvailable = true;

      operatingStatus = "Break";

      mapView = "Zoom";


      /* ---------------------------------------------------------
         Route-Seite verlassen
         --------------------------------------------------------- */

      routeInputPanel.classList.remove(
        "is-open"
      );


      routeCandidates.classList.remove(
        "is-visible"
      );

        "is-visible"
      );


      btnMyLocation.classList.remove(
        "is-visible"

      activeRoutePoint = null;

        "is-visible"

      routeScreen.classList.remove(

      );


      cockpitScreen.classList.add(

          map.invalidateSize(true);


          if (testRouteLine) {

              {
                animate: false,
                padding: [30,30]
              }
            );

          }

        }
      );


      updateUI();

    }

    /* =========================================================
       GPS
       ========================================================= */

    try {

      const GPS =
        registerPlugin("GPS");


      GPS.addListener(
        "gpsData",
        data => {

          document.getElementById(
            "vSpeed"
          ).textContent =
            `${(data.speed * 3.6).toFixed(1)} km/h`;


          document.getElementById(
            "vAltitude"
          ).textContent =
            `${data.altitude.toFixed(0)} m`;


          const position = [
            data.lat,
            data.lon
          ];


          const speedKmh =
            (Number(data.speed) || 0) *
            3.6;


          if (!gpsMarker) {

            gpsMarker =
              L.marker(
                position,
                {
                  icon: gpsDotIcon,
                  zIndexOffset: 1000
                }
              ).addTo(map);

          } else {

            gpsMarker.setLatLng(
              position
            );


            gpsMarker.setIcon(
              speedKmh >= 1
                ? gpsArrowIcon
                : gpsDotIcon
            );

          }


          if (
            data.courseValid &&
            gpsMarker
          ) {

            const arrow =
              gpsMarker
                .getElement()
                ?.querySelector("div");


            if (arrow) {

              arrow.style.transform =
                `rotate(${data.course}deg)`;

            }

          }


          if (!mapCenteredOnGps) {

            mapCenteredOnGps = true;


            setTimeout(
              () =>
                map.setView(
                  position,
                  17
                ),
              1000
            );

          }


          lastGpsData = data;

        }
      );


      setTimeout(
        () =>
          GPS.start().catch(
            () => {}
          ),
        500
      );

    } catch (_) {

      /* Browser-Vorschau ohne Capacitor */

    }

  </script>

</body>
</html>
